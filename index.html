<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown Town</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  :root { --bg:#1b1726; --ink:#f4efe6; --dim:#a79fb8; --panel:#2a2438; --line:#463d5c; --work:#ffb454; --help:#ff6b7a; --rest:#7fd1a8; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family: Galmuri11, ui-monospace, 'Apple SD Gothic Neo', monospace; font-size:13px; }
  header { height:52px; display:flex; align-items:center; gap:14px; padding:0 16px; border-bottom:2px solid var(--line); }
  h1 { font-size:16px; margin:0; letter-spacing:1px; }
  h1 span { color:var(--work); }
  .chip { padding:3px 9px; border:2px solid var(--line); border-radius:4px; background:var(--panel); white-space:nowrap; }
  .chip b { font-weight:normal; }
  .chip.work b { color:var(--work); } .chip.help b { color:var(--help); } .chip.rest b { color:var(--rest); }
  .grow { flex:1; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:4px; padding:3px 9px; cursor:pointer; }
  button:hover { border-color:var(--work); }
  #clock { color:var(--dim); }
  main { display:flex; justify-content:center; padding:10px 12px; }
  #stage { position:relative; border:4px solid #0e0b16; box-shadow:0 0 0 2px var(--line); }
  canvas { display:block; image-rendering:pixelated; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .zone { position:absolute; font-size:11px; color:rgba(40,28,20,.75); background:rgba(255,250,235,.55); padding:1px 6px; border-radius:3px; }
  .tag { position:absolute; transform:translate(-50%,0); font-size:10px; white-space:nowrap; padding:1px 5px;
    background:rgba(20,16,30,.82); border-radius:3px; max-width:calc(55px * var(--s)); overflow:hidden; text-overflow:ellipsis; }
  .tag i { font-style:normal; color:var(--work); margin-right:4px; }
  .tag.sel { outline:2px solid var(--work); }
  .bubble { position:absolute; transform:translate(-50%,-100%); width:max-content; max-width:calc(60px * var(--s)); font-size:11px; line-height:1.35;
    background:#fffdf6; color:#2a2233; border:2px solid #2a2233; border-radius:6px; padding:3px 6px; }
  .bubble span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bubble { max-width:calc(68px * var(--s)); } .bubble span { -webkit-line-clamp:1; } /* 책상 줄 간격이 좁아 한 줄만, 전체 내용은 패널에서 */
  .bubble.help { border-color:#b8404e; background:#fff0f1; }
  .bubble.help { max-width:calc(47px * var(--s)); } .bubble.help span { -webkit-line-clamp:1; }
  .bubble em { font-style:normal; color:#b35c00; }
  #panel { position:fixed; top:64px; right:12px; width:320px; max-height:calc(100vh - 80px); overflow:auto; display:none;
    background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:14px; }
  #panel h2 { font-size:14px; margin:0 24px 8px 0; line-height:1.4; }
  #panel .x { position:absolute; top:8px; right:8px; padding:0 6px; }
  #panel dl { margin:0; display:grid; grid-template-columns:72px 1fr; gap:6px 8px; }
  #panel dt { color:var(--dim); } #panel dd { margin:0; word-break:break-word; line-height:1.45; }
  #panel a { color:var(--work); }
  #panel h3 { font-size:12px; color:var(--dim); margin:14px 0 8px; border-top:2px solid var(--line); padding-top:10px; font-weight:normal; }
  .badge { display:inline-block; padding:1px 7px; border-radius:3px; color:#1b1726; }
  .dress { display:grid; grid-template-columns:72px 1fr; gap:6px 8px; align-items:center; }
  .dress input[type=color] { width:44px; height:24px; padding:0; border:2px solid var(--line); background:none; }
  .dress input[type=text], .dress select { font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:3px 6px; width:100%; }
  .cmds div { display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin-bottom:8px; align-items:center; }
  .cmds span { grid-column:1 / 3; color:var(--dim); font-size:11px; }
  .cmds code { background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:3px 6px; font-family:inherit; user-select:all; }
  .ask { margin-top:10px; background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:8px; max-height:220px; overflow:auto; white-space:pre-wrap; word-break:break-word; line-height:1.5; font-size:12px; }
  .ask.help { border-color:var(--help); }
  .hint { color:var(--dim); font-size:11px; line-height:1.5; margin:8px 0 0; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; }
  button.danger:hover { border-color:var(--help); color:var(--help); }
  button.primary { border-color:var(--work); color:var(--work); }
  details { margin-top:10px; } summary { color:var(--dim); font-size:11px; cursor:pointer; margin-bottom:8px; }
  #modal { position:fixed; inset:0; background:rgba(10,8,16,.7); display:none; align-items:center; justify-content:center; z-index:10; }
  #modal .box { width:min(440px, calc(100vw - 32px)); background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:16px; }
  #modal h2 { font-size:14px; margin:0 0 10px; } #modal p { margin:0 0 12px; line-height:1.55; color:var(--ink); }
  #modal label { display:block; color:var(--dim); font-size:11px; margin:10px 0 4px; }
  #modal select, #modal textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:6px; }
  #modal textarea { height:110px; resize:vertical; }
  #modal .row { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  #toasts { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; }
  .toast { background:#fffdf6; color:#2a2233; border:2px solid #2a2233; border-radius:6px; padding:6px 12px; }
  #offline { display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); background:var(--help); color:#1b1726; padding:4px 12px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1><span>*</span> Dropdown Town</h1>
  <div class="chip work">일하는 중 <b id="nWork">0</b></div>
  <div class="chip help"><span id="ownerChip">마스터 기다리는 중</span> <b id="nHelp">0</b></div>
  <div class="chip rest">쉬는 중 <b id="nRest">0</b></div>
  <div class="grow"></div>
  <span id="clock"></span>
  <button id="newBtn">+ 새 세션</button>
  <button id="style">캐릭터: 도트</button>
  <button id="sound">알림음 꺼짐</button>
</header>
<main><div id="stage"><canvas id="cv" width="480" height="300"></canvas><div id="labels"></div></div></main>
<aside id="panel"></aside>
<div id="toasts"></div>
<div id="modal"><div class="box"></div></div>
<div id="offline">서버와 연결이 끊겼어요. node server.mjs 가 켜져 있는지 확인해 주세요.</div>

<script>
const W = 480, H = 300, SPEED = 60
// 화면에서 사용자를 부르는 호칭. 주소에 ?owner=대장 처럼 붙이면 바뀌고 그 뒤로 기억한다.
let OWNER = '마스터'
try { const q = new URLSearchParams(location.search).get('owner'); if (q) localStorage.setItem('town.owner', q.slice(0, 8)); OWNER = localStorage.getItem('town.owner') || OWNER } catch {}
document.getElementById('ownerChip').textContent = `${OWNER} 기다리는 중`
const cv = document.getElementById('cv'), ctx = cv.getContext('2d')
ctx.imageSmoothingEnabled = false
const labels = document.getElementById('labels'), panel = document.getElementById('panel')
let scale = 2

const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h) }
const hash = (s) => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) } return h >>> 0 }
const shade = (hex, f) => '#' + [1, 3, 5].map((i) => Math.max(0, Math.min(255, Math.round(parseInt(hex.slice(i, i + 2), 16) * f))).toString(16).padStart(2, '0')).join('')
const hsl2hex = (h, s, l) => { const a = s * Math.min(l, 1 - l); const f = (n) => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0') }; return '#' + f(0) + f(8) + f(4) }

/* ---------- 자리 배치 ---------- */
// 위쪽이 작업실(오른쪽 빨간 카펫은 호출 구역), 아래쪽이 휴게실이다. 두 방은 벽으로 나뉘고 GATE_X 의 문틈으로만 오간다.
const LANES = { work: 158, lounge: 218 }, GATE_X = 342
const deskPos = (i) => ({ x: 14 + (i % 4) * 72, y: 78 + Math.floor(i / 4) * 54 })
// 휴게실 자리: face 는 앉아서 바라보는 방향, kind 는 가구 종류. 여러 가구에 골고루 앉도록 순서를 섞어 두었다.
const TV_SEAT = (k) => ({ x: 38 + k * 15, y: 250, face: 'up', kind: 'sofaBack' })
const LOW_SEAT = (x0, k) => ({ x: x0 + 3 + k * 15, y: 268, face: 'down', kind: 'sofa' })
const REST = [
  TV_SEAT(1), { x: 131, y: 226, face: 'right', kind: 'sofa' }, { x: 249, y: 210, face: 'up', kind: 'arcade' }, LOW_SEAT(300, 1),
  { x: 191, y: 226, face: 'left', kind: 'sofa' }, TV_SEAT(0), LOW_SEAT(370, 1), { x: 432, y: 240, face: 'down', kind: 'bag' },
  { x: 271, y: 210, face: 'up', kind: 'arcade' }, LOW_SEAT(300, 0), { x: 131, y: 244, face: 'right', kind: 'sofa' }, TV_SEAT(2),
  LOW_SEAT(370, 0), { x: 191, y: 244, face: 'left', kind: 'sofa' }, LOW_SEAT(300, 2), LOW_SEAT(370, 2), { x: 454, y: 262, face: 'down', kind: 'bag' },
]
const SPOTS = {
  work: (i) => {
    if (i >= 8) return { x: 300, y: 70 + (i - 8) * 26, aisle: null, room: 'work', face: 'down' } // 책상이 모자라면 복도에 서서 일한다
    const d = deskPos(i); return { x: d.x + 18, y: d.y - 14, aisle: d.x + 54, room: 'work', face: 'down' }
  },
  help: (i) => ({ x: 380 + (i % 2) * 48, y: 84 + i * 26, aisle: null, room: 'work', face: 'down' }),
  rest: (i) => ({ aisle: null, room: 'lounge', ...(REST[i] || { x: 100 + ((i - REST.length) % 8) * 22, y: 276, face: 'down', kind: 'bag' }) }),
}
// 서브에이전트(조수)는 부모 세션의 책상 오른쪽에 선다. 부모가 책상에 없으면 그 옆에 선다.
function subSpot(parent, k) {
  if (parent.zone === 'work' && parent.slot < 8) { const d = deskPos(parent.slot); return { x: d.x + 50 + k * 8, y: d.y - 12 + k * 6, aisle: d.x + 54, room: 'work', face: 'left' } }
  return { x: parent.spot.x + 14 + k * 10, y: parent.spot.y, aisle: null, room: parent.spot.room, face: 'left' }
}
const slots = { work: [], help: [], rest: [] }
function takeSlot(zone, id) {
  const arr = slots[zone]
  let i = arr.indexOf(null)
  if (i === -1) i = arr.length
  arr[i] = id
  return i
}
function freeSlot(e) { if (e.zone && slots[e.zone]) slots[e.zone][e.slot] = null }

const zoneOf = (s) => (s.state === 'working' ? 'work' : ['done', 'idle', 'stopped'].includes(s.state) ? 'rest' : 'help') // 모르는 상태는 눈에 띄게 호출 구역으로

function route(from, to) {
  const pts = [], fromRoom = from.room || 'work', toRoom = to.room || 'work'
  let x = from.x
  if (from.aisle != null) { pts.push({ x: from.aisle, y: from.y }); x = from.aisle }
  pts.push({ x, y: LANES[fromRoom] })
  if (fromRoom !== toRoom) { pts.push({ x: GATE_X, y: LANES[fromRoom] }); pts.push({ x: GATE_X, y: LANES[toRoom] }) }
  const tx = to.aisle != null ? to.aisle : to.x
  pts.push({ x: tx, y: LANES[toRoom] })
  if (to.aisle != null) pts.push({ x: tx, y: to.y })
  pts.push({ x: to.x, y: to.y })
  return pts
}

/* ---------- 캐릭터 생김새 ---------- */
const HAIRS = ['#2b2230', '#5a3a22', '#8a5a2b', '#d9a441', '#c0392b', '#6b6b7a', '#e8e0d0', '#3b4a8a']
const SKINS = ['#f7d7b5', '#f0c29a', '#d9a377', '#b07a50', '#8a5a3a']
const ACCS = { none: '없음', cap: '모자', headphones: '헤드폰', shades: '선글라스', crown: '왕관', cat: '고양이 귀' }
function defaultLook(s) {
  const h = hash(s.id)
  const accKeys = ['none', 'none', 'cap', 'headphones', 'shades', 'cat']
  return {
    hair: HAIRS[h % HAIRS.length], skin: SKINS[(h >>> 4) % SKINS.length],
    shirt: hsl2hex((h >>> 8) % 360, 0.55, 0.55),
    acc: s.kind === 'interactive' ? 'crown' : accKeys[(h >>> 16) % accKeys.length], nick: '',
    body: hash(s.id + 'body') % 6, outfit: s.kind === 'sub' ? 13 : hash(s.id + 'outfit') % 11, hairStyle: hash(s.id + 'hair') % 12, // 도트 캐릭터용(모자 달린 옷은 직접 고를 때만)
  }
}
function loadLook(s) {
  try { return { ...defaultLook(s), ...JSON.parse(localStorage.getItem('town.look.' + s.id) || '{}') } } catch { return defaultLook(s) }
}
function saveLook(e) { try { localStorage.setItem('town.look.' + e.id, JSON.stringify(e.look)) } catch {} }

function drawChar(c, x, y, look, pose, t, seed) {
  const f2 = Math.floor(t / 180 + seed) % 2, s2 = Math.floor(t / 600 + seed) % 2
  const dark = '#2a2233', pants = '#3a3550'
  let yy = y
  if (pose === 'walk' && f2) yy -= 1
  if (pose === 'alert' && f2) yy -= 2
  if (pose === 'type' && s2) yy += 1
  R(c, x + 2, y + 15, 8, 1, 'rgba(0,0,0,.22)')
  // 다리
  if (pose === 'walk') { R(c, x + 3, yy + 13, 2, f2 ? 3 : 2, pants); R(c, x + 7, yy + 13, 2, f2 ? 2 : 3, pants) }
  else if (pose === 'sleep' || pose === 'coffee' || pose === 'chill') { R(c, x + 2, yy + 13, 3, 2, pants); R(c, x + 7, yy + 13, 3, 2, pants) }
  else { R(c, x + 3, yy + 13, 2, 3, pants); R(c, x + 7, yy + 13, 2, 3, pants) }
  // 몸통과 팔
  R(c, x + 2, yy + 8, 8, 5, look.shirt); R(c, x + 2, yy + 12, 8, 1, shade(look.shirt, 0.78))
  if (pose === 'alert') {
    R(c, x, yy + 4, 1, 4, look.shirt); R(c, x, yy + 3, 1, 1, look.skin)
    R(c, x + 11, yy + 4 - f2, 1, 4, look.shirt); R(c, x + 11, yy + 3 - f2, 1, 1, look.skin)
  } else {
    R(c, x + 1, yy + 8, 1, 4, look.shirt); R(c, x + 1, yy + 12, 1, 1, look.skin)
    R(c, x + 10, yy + 8, 1, 4, look.shirt); R(c, x + 10, yy + 12, 1, 1, look.skin)
  }
  if (pose === 'coffee') {
    R(c, x + 10, yy + 10, 3, 3, '#ffffff'); R(c, x + 10, yy + 10, 3, 1, '#6b4226')
    R(c, x + 11, yy + 7 - s2, 1, 2, 'rgba(255,255,255,.7)')
  }
  // 머리
  R(c, x + 2, yy + 1, 8, 7, look.skin)
  R(c, x + 2, yy, 8, 3, look.hair); R(c, x + 1, yy + 1, 1, 4, look.hair); R(c, x + 10, yy + 1, 1, 4, look.hair)
  const blink = Math.floor(t / 120 + seed * 7) % 40 === 0
  if (look.acc === 'shades') R(c, x + 3, yy + 4, 6, 2, '#111')
  else if (pose === 'sleep' || blink) { R(c, x + 3, yy + 5, 2, 1, dark); R(c, x + 7, yy + 5, 2, 1, dark) }
  else { R(c, x + 4, yy + 4, 1, 2, dark); R(c, x + 7, yy + 4, 1, 2, dark) }
  R(c, x + 3, yy + 6, 1, 1, '#f29c9c'); R(c, x + 8, yy + 6, 1, 1, '#f29c9c')
  // 장식
  if (look.acc === 'cap') { R(c, x + 1, yy - 1, 10, 3, shade(look.shirt, 0.7)); R(c, x + 2, yy + 2, 9, 1, shade(look.shirt, 0.5)) }
  if (look.acc === 'headphones') { R(c, x + 1, yy - 1, 10, 1, '#333'); R(c, x, yy + 2, 2, 4, '#333'); R(c, x + 10, yy + 2, 2, 4, '#333') }
  if (look.acc === 'crown') { R(c, x + 3, yy - 2, 6, 2, '#f5c542'); R(c, x + 3, yy - 3, 1, 1, '#f5c542'); R(c, x + 5, yy - 3, 2, 1, '#f5c542'); R(c, x + 8, yy - 3, 1, 1, '#f5c542') }
  if (look.acc === 'cat') { R(c, x + 2, yy - 2, 2, 2, look.hair); R(c, x + 8, yy - 2, 2, 2, look.hair); R(c, x + 2, yy - 1, 1, 1, '#f29c9c'); R(c, x + 9, yy - 1, 1, 1, '#f29c9c') }
}

/* ---------- 도트 캐릭터 (MetroCity 에셋, CC0) ---------- */
// 시트는 32x32 프레임 24칸: 0~5 앞, 6~11 오른쪽, 12~17 뒤, 18~23 왼쪽(각 6칸 달리기 동작). 몸 위에 머리와 옷을 겹쳐 입힌다.
const SPRITE_FILES = ['model', 'outfit1', 'outfit2', 'outfit4', 'outfit5', 'outfit6', 'suit', 'suit1', 'hairs', 'hair2']
const BODIES = ['밝은 피부 1', '밝은 피부 2', '밝은 피부 3', '어두운 피부 1', '아주 밝은 피부', '어두운 피부 2']
const OUTFITS = [
  { name: '흰 티', src: 'outfit5', row: 0 }, { name: '주황 티', src: 'outfit4', row: 0 }, { name: '빨간 티', src: 'outfit6', row: 0 },
  { name: '보라 티', src: 'outfit2', row: 0 }, { name: '원피스', src: 'outfit1', row: 0 }, { name: '정장', src: 'suit', row: 2 },
  { name: '흰 셔츠', src: 'suit1', row: 0 }, { name: '분홍 셔츠', src: 'suit1', row: 1 }, { name: '파란 셔츠', src: 'suit1', row: 2 },
  { name: '민트 셔츠', src: 'suit1', row: 3 }, { name: '자주 셔츠', src: 'suit1', row: 4 },
  { name: '경찰', src: 'suit', row: 0, hat: true }, { name: '벨보이', src: 'suit', row: 1, hat: true }, { name: '작업모', src: 'suit', row: 3, hat: true },
]
const HAIRSTYLES = [...Array(8).keys()].map((r) => ({ src: 'hairs', row: r })).concat([0, 2, 3, 4].map((r) => ({ src: 'hair2', row: r })))
const DIR_BASE = { down: 0, right: 6, up: 12, left: 18 }
const sprites = {}
let spritesReady = false, style = 'sprite'
try { style = localStorage.getItem('town.style') || 'sprite' } catch {}
style = new URLSearchParams(location.search).get('style') || style // 주소에 ?style=basic 을 붙여도 된다
Promise.all(SPRITE_FILES.map((name) => new Promise((ok, fail) => {
  const img = new Image(); img.onload = () => { sprites[name] = img; ok() }; img.onerror = fail; img.src = `assets/metrocity/${name}.png`
}))).then(() => { spritesReady = true }).catch(() => {}) // 에셋이 없으면 기본 캐릭터로 그린다
const useSprites = () => style === 'sprite' && spritesReady

function sheetOf(e) { // 몸 + 머리 + 옷을 한 줄짜리 시트로 미리 합쳐 둔다
  if (e.sheet) return e.sheet
  const cvs = document.createElement('canvas'); cvs.width = 768; cvs.height = 32
  const c = cvs.getContext('2d'), outfit = OUTFITS[e.look.outfit] || OUTFITS[0], hair = HAIRSTYLES[e.look.hairStyle]
  c.drawImage(sprites.model, 0, (e.look.body % 6) * 32, 768, 32, 0, 0, 768, 32)
  if (hair && !outfit.hat) c.drawImage(sprites[hair.src], 0, hair.row * 32, 768, 32, 0, 0, 768, 32)
  c.drawImage(sprites[outfit.src], 0, outfit.row * 32, 768, 32, 0, 0, 768, 32)
  return (e.sheet = cvs)
}
const SPRITE_RISE = 12 // 도트 캐릭터는 기본 캐릭터보다 12px 크다
function drawSprite(c, e, pose, t, sink) {
  const moving = pose === 'walk' || pose === 'alert'
  const face = pose === 'walk' ? e.dir : e.spot.face || 'down'
  let frame = DIR_BASE[face] + (moving ? Math.floor(t / 95 + e.seed) % 6 : 0)
  if (pose === 'play' && Math.floor(t / 220 + e.seed) % 3 === 0) frame += 1 // 조이스틱을 흔드는 느낌
  let dy = e.y - 15 + sink
  if (pose === 'alert' && Math.floor(t / 180) % 2) dy -= 2
  if ((pose === 'type' || pose === 'assist') && Math.floor(t / 600 + e.seed) % 2) dy += 1
  R(c, e.x + 1, e.y + 15 + sink, 10, 2, 'rgba(0,0,0,.22)')
  c.drawImage(sheetOf(e), frame * 32, 0, 32, 32, Math.round(e.x) - 10, Math.round(dy), 32, 32)
  if (pose === 'coffee' && face === 'down') { R(c, e.x + 12, e.y + 4, 3, 3, '#ffffff'); R(c, e.x + 12, e.y + 4, 3, 1, '#6b4226'); R(c, e.x + 13, e.y + 1 - (Math.floor(t / 600) % 2), 1, 2, 'rgba(255,255,255,.7)') }

}

// 고양이: 휴게실을 어슬렁거리다 앉고, 벽난로 앞에서 잔다.
const cat = { x: 170, y: 262, tx: 170, ty: 262, mode: 'sit', until: 0, dir: 1 }
function stepCat(t, dt) {
  if (t > cat.until) {
    const roll = Math.random()
    if (roll < 0.25) { cat.mode = 'walk'; cat.tx = 160; cat.ty = 258; cat.next = 'sleep' } // 벽난로 앞으로
    else if (roll < 0.8) { cat.mode = 'walk'; cat.tx = 100 + Math.random() * 190; cat.ty = 252 + Math.random() * 38; cat.next = 'sit' }
    else cat.mode = 'sit'
    cat.until = t + 4000 + Math.random() * 9000
  }
  if (cat.mode === 'walk') {
    const dx = cat.tx - cat.x, dy = cat.ty - cat.y, d = Math.hypot(dx, dy)
    if (d < 1) { cat.mode = cat.next; cat.until = t + (cat.next === 'sleep' ? 20000 : 5000) + Math.random() * 8000 }
    else { cat.x += (dx / d) * 22 * dt; cat.y += (dy / d) * 22 * dt; cat.dir = dx >= 0 ? 1 : -1 }
  }
}
function drawCat(c, t) {
  const x = Math.round(cat.x), y = Math.round(cat.y), o = '#e8923a', d = '#b8651f', f = Math.floor(t / 160) % 2
  R(c, x, y + 7, 10, 1, 'rgba(0,0,0,.2)')
  if (cat.mode === 'sleep') { R(c, x + 1, y + 3, 8, 4, o); R(c, x + 2, y + 2, 5, 1, o); R(c, x + 6, y + 4, 3, 2, d); R(c, x + 1, y + 5, 2, 1, d); drawZzz(c, x - 6, y + 2, t); return }
  const hx = cat.dir > 0 ? x + 6 : x
  R(c, x + 2, y + 3, 7, 3, o); R(c, hx, y + 1, 4, 4, o); R(c, hx, y, 1, 1, d); R(c, hx + 3, y, 1, 1, d); R(c, hx + (cat.dir > 0 ? 2 : 1), y + 2, 1, 1, '#2a2233')
  R(c, cat.dir > 0 ? x : x + 9, y + 1 + (Math.floor(t / 300) % 2), 1, 3, d)
  if (cat.mode === 'walk') { R(c, x + 2 + f, y + 6, 1, 1, d); R(c, x + 7 - f, y + 6, 1, 1, d) } else { R(c, x + 3, y + 6, 1, 1, d); R(c, x + 7, y + 6, 1, 1, d) }
}

function drawDesk(c, d, busy, t, seed) {
  R(c, d.x + 2, d.y + 20, 3, 6, '#5a3a22'); R(c, d.x + 43, d.y + 20, 3, 6, '#5a3a22')
  R(c, d.x, d.y, 48, 14, '#e0b683'); R(c, d.x, d.y, 48, 1, '#f0cfa2'); R(c, d.x, d.y + 14, 48, 8, '#a8794a'); R(c, d.x, d.y + 21, 48, 1, '#8a5f38')

    R(c, d.x + 23, d.y, 2, 3, on ? '#ff8a3d' : '#d9763a'); R(c, d.x + 22, d.y + 1, 4, 1, on ? '#ff8a3d' : '#d9763a')
    R(c, d.x + 14, d.y + 7, 20, 2, '#9aa0ad')

/* ---------- 엔티티 ---------- */
const DOOR = { x: 336, y: 38, aisle: null, room: 'work', face: 'down' }
const ents = new Map()
let firstLoad = true, selected = null, hovered = null
const entsIn = (zone) => { let n = 0; for (const e of ents.values()) if (e.zone === zone) n++; return n }

function makeEnt(s) {
  const e = { id: s.id, data: s, zone: null, slot: -1, x: DOOR.x, y: DOOR.y, path: [], spot: DOOR, look: loadLook(s), seed: hash(s.id) % 97, dir: 'down', sheet: null }
  e.tag = document.createElement('div'); e.tag.className = 'tag'
  e.bubble = document.createElement('div'); e.bubble.className = 'bubble'
  labels.append(e.tag, e.bubble)
  ents.set(s.id, e)
  return e
}
function walkTo(e, spot, teleport) {
  if (teleport) { e.x = spot.x; e.y = spot.y; e.path = [] }
  else e.path = route(e.path.length ? { x: e.x, y: e.y, aisle: null, room: e.y > 190 ? 'lounge' : 'work' } : e.spot, spot)
  e.spot = spot
}
function moveTo(e, zone, teleport) {
  freeSlot(e)
  e.zone = zone; e.slot = takeSlot(zone, e.id)
  walkTo(e, SPOTS[zone](e.slot), teleport)
}
function leave(e) { e.leaving = true; freeSlot(e); e.zone = null; walkTo(e, DOOR, false) }

const TOOL_KO = { Bash: '터미널', Edit: '코드 수정', Write: '파일 작성', Read: '파일 읽기', Grep: '검색', Glob: '검색', Agent: '조수 부르기', Task: '조수 부르기', WebFetch: '웹 조회', WebSearch: '웹 검색', Skill: '스킬', Artifact: '페이지 만들기', ToolSearch: '도구 찾기' }
const toolKo = (n) => !n ? '' : TOOL_KO[n] || (n.includes('playwright') || n.includes('browser') ? '브라우저' : n.startsWith('mcp__') ? n.split('__')[1] : n)
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]))
const level = (tokens) => 1 + Math.floor(Math.log2(tokens / 1000 + 1))
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s)
const isSub = (e) => e.data.kind === 'sub'

function refreshLabels(e) {
  const s = e.data, name = e.look.nick || s.name
  const extra = !isSub(e) && s.subagents.length > 2 ? ` +${s.subagents.length - 2}` : ''
  e.tag.innerHTML = isSub(e) ? `<i>조수</i>${esc(name)}` : `<i>Lv.${level(s.tokens)}</i>${esc(name)}${extra}`
  e.tag.classList.toggle('sel', selected === e.id)
  let html = ''
  if (e.zone === 'work') { const tk = s.phase === 'tool' ? toolKo(s.tool) : s.phase === 'thinking' ? '생각 중' : ''; html = (tk ? `<em>[${esc(tk)}]</em> ` : '') + esc(s.detail || '') }
  else if (e.zone === 'help') html = esc(s.detail || '답을 기다리고 있어요')
  e.bubble.className = 'bubble' + (e.zone === 'help' ? ' help' : '')
  e.bubble.innerHTML = html ? `<span>${html}</span>` : ''
  e.bubble.dataset.empty = html ? '' : '1'
}

function sync(list) {
  const seen = new Set()
  for (const s of list) {
    seen.add(s.id)
    let e = ents.get(s.id)
    const zone = zoneOf(s)
    if (!e) { e = makeEnt(s); moveTo(e, zone, firstLoad); if (!firstLoad) toast(`‘${s.name}’ 이(가) 출근했어요`) }
    else {
      e.data = s
      if (zone !== e.zone && !e.leaving) {
        moveTo(e, zone, false)
        if (zone === 'help') { toast(`‘${e.look.nick || s.name}’ 이(가) 호출 벨을 눌렀어요`); beep(880) }
        if (zone === 'rest') { toast(`‘${e.look.nick || s.name}’ 작업이 끝났어요`); beep(523) }
      }
    }
    refreshLabels(e)
    // 서브에이전트는 작업모를 쓴 조수로 등장한다(책상 옆 자리가 둘뿐이라 둘까지만 그리고, 나머지는 이름표에 +N)
    s.subagents.slice(0, 2).forEach((a, k) => {
      const id = 'sub-' + a.id, data = { id, kind: 'sub', name: a.type, parent: s.id, description: a.description, updatedAt: a.at, tokens: 0, subagents: [] }
      seen.add(id)
      let sub = ents.get(id)
      const spot = subSpot(e, k)
      if (!sub) { sub = makeEnt(data); sub.zone = 'sub'; walkTo(sub, spot, firstLoad) }
      else { sub.data = data; if (!sub.leaving && (spot.x !== sub.spot.x || spot.y !== sub.spot.y)) walkTo(sub, spot, false) }
      refreshLabels(sub)
    })
  }
  for (const e of ents.values()) if (!seen.has(e.id) && !e.leaving) leave(e)
  const preselect = firstLoad && new URLSearchParams(location.search).get('select') // 주소의 ?select=세션id 로 그 캐릭터 패널을 연 채 시작한다
  if (preselect && ents.has(preselect)) { selected = preselect; renderPanel() }
  firstLoad = false
  const n = { work: entsIn('work'), help: entsIn('help'), rest: entsIn('rest') }
  nWork.textContent = n.work; nHelp.textContent = n.help; nRest.textContent = n.rest
  document.title = (n.help ? `(${n.help}) ` : '') + 'Dropdown Town'
  if (selected && ents.has(selected)) renderPanel(false)
}

function step(e, dt) {
  let left = SPEED * dt
  while (left > 0 && e.path.length) {
    const p = e.path[0], dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy)
    if (d > 0.01) e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'
    if (d <= left) { e.x = p.x; e.y = p.y; e.path.shift(); left -= d }
    else { e.x += (dx / d) * left; e.y += (dy / d) * left; left = 0 }
  }
  if (e.leaving && !e.path.length) { e.tag.remove(); e.bubble.remove(); ents.delete(e.id); if (selected === e.id) closePanel() }
}
function poseOf(e) {
  if (e.path.length) return 'walk'
  if (isSub(e)) return 'assist'
  if (e.zone === 'work') return 'type'
  if (e.zone === 'help') return 'alert'
  if (e.spot.kind === 'arcade') return 'play'
  if (e.data.state === 'idle') return 'chill'
  return Date.now() - (e.data.updatedAt || 0) < 24 * 3600 * 1000 ? 'coffee' : 'sleep'
}

/* ---------- 그리기 루프 ---------- */
let lastT = performance.now()
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t
  ctx.drawImage(bg, 0, 0)
  const items = []
  for (let i = 0; i < 8; i++) {
    const d = deskPos(i), owner = ents.get(slots.work[i]), busy = Boolean(owner && !owner.path.length)
    items.push({ base: d.y + 22, draw: (c) => drawDesk(c, d, busy, t, i) })
  }
  REST.forEach((p, i) => { if (p.kind === 'bag') items.push({ base: p.y + 10, draw: (c) => drawBag(c, p, i) }) })
  slots.rest.forEach((id, i) => { if (i >= REST.length && id != null) { const p = SPOTS.rest(i); items.push({ base: p.y + 10, draw: (c) => drawBag(c, p, i) }) } })
  stepCat(t, dt)
  drawProps(items, t)

  for (const e of ents.values()) {
    step(e, dt)
    const pose = poseOf(e)
    const seated = e.zone === 'work' && !e.path.length && e.slot < 8
    const sprite = useSprites(), sink = sprite && seated ? 6 : 0 // 앉으면 다리가 책상 뒤로 가려지게 조금 내린다
    const hy = sprite ? e.y - SPRITE_RISE + sink : e.y
    items.push({ base: e.y + 16, draw: (c) => {
      if (sprite) drawSprite(c, e, pose, t, sink)
      else drawChar(c, e.x, e.y, isSub(e) ? { ...e.look, acc: 'cap', shirt: '#ff8a3d' } : e.look, pose === 'play' || pose === 'assist' ? 'idle' : pose, t, e.seed)
      if (pose === 'sleep') drawZzz(c, e.x, hy, t)
      if (pose === 'alert') drawBang(c, e.x, hy, t)
      if (pose === 'type') (e.data.phase === 'tool' ? drawDots(c, e.x + 14, hy + 1, t) : drawSpark(c, e.x + 15, hy - 1, t))
      if (pose === 'assist') drawDots(c, e.x + 1, hy - 5, t)
      if (hovered === e.id || selected === e.id) { c.strokeStyle = '#fff'; c.lineWidth = 1; c.strokeRect(Math.round(e.x) - 1.5, Math.round(hy) - 3.5, 15, Math.round(e.y - hy) + 21 + sink) }
    } })
    e.hy = hy
    // 이름표와 말풍선 위치. 휴게실 캐릭터와 조수는 가구를 가리지 않도록 마우스를 올렸을 때만 이름표를 보여준다.
    const quiet = (e.zone === 'rest' || isSub(e)) && hovered !== e.id && selected !== e.id
    e.tag.style.display = quiet ? 'none' : 'block'
    e.tag.style.left = (e.x + 6) * scale + 'px'
    e.tag.style.top = (seated ? e.y + 28.5 : e.y + 18) * scale + 'px' // 앉아 있으면 책상 앞면의 명패 자리
    const show = !e.bubble.dataset.empty && !e.path.length
    e.bubble.style.display = show ? 'block' : 'none'
    if (show) { const half = e.bubble.offsetWidth / 2 + 2; e.bubble.style.left = Math.max(half, Math.min(W * scale - half, (e.x + 6) * scale)) + 'px'; e.bubble.style.top = (hy - (e.zone === 'help' ? 15 : 4)) * scale + 'px' }
  }
  items.sort((a, b) => a.base - b.base)
  for (const it of items) it.draw(ctx)
  requestAnimationFrame(frame)
}

/* ---------- 상세 패널 ---------- */
const ago = (ms) => { if (!ms) return '알 수 없음'; const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? '방금' : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${Math.floor(s / 86400)}일 전` }
const MODE_KO = { auto: '오토 모드 (스스로 판단해서 진행)', default: '기본 (도구를 쓸 때마다 물어봄)', acceptEdits: '파일 수정은 자동 수락', plan: '계획 모드 (실행 전 계획만)', bypassPermissions: '권한 확인 생략' }
// 호출 벨 앞에 선 세션이 무엇을 기다리는지, 끝난 세션이 마지막에 뭐라고 했는지 보여준다.
function askBlock(e) {
  const s = e.data
  if (e.zone === 'help') {
    const pending = s.pending ? `허락을 기다리는 도구: [${toolKo(s.pending.name)}] ${s.pending.what}\n\n` : ''
    const how = s.permissionMode === 'auto'
      ? '오토 모드라서 도구 권한은 스스로 처리합니다. 지금 멈춘 것은 결정이나 입력이 필요해서예요. "터미널에서 열어 답하기"로 답해 주세요.'
      : '수락과 거절은 Claude Code 화면에서만 할 수 있어요. "터미널에서 열어 답하기"를 누르면 그 세션이 바로 열립니다.'
    return `<h3>${OWNER}에게 요청한 내용</h3><div class="ask help">${esc(pending + (s.lastText || s.detail || '기록을 찾지 못했어요'))}</div><p class="hint">${how}</p>`
  }
  if (e.zone === 'rest' && (s.lastText || s.result)) return `<h3>마지막으로 한 말</h3><div class="ask">${esc(s.lastText || s.result)}</div>`
  return ''
}
function actsBlock(e) {
  const s = e.data
  if (s.kind !== 'bg') return ''
  const cmds = [['이어서 보기', `claude attach ${s.id}`], ['최근 출력', `claude logs ${s.id}`], ['멈추기', `claude stop ${s.id}`], ['지우기', `claude rm ${s.id}`]]
  return `<h3>세션 다루기</h3><div class="acts">
      <button class="primary" data-act="attach">${e.zone === 'help' ? '터미널에서 열어 답하기' : '터미널에서 열기'}</button>
      ${e.zone === 'work' || e.zone === 'help' ? '<button class="danger" data-act="stop">세션 멈추기</button>' : ''}
      ${e.zone === 'rest' ? '<button class="danger" data-act="remove">세션 지우기</button>' : ''}
    </div>
    <details><summary>터미널 명령으로 직접 하기</summary><div class="cmds">${cmds.map(([label, cmd]) => `<div><span>${label}</span><code>${cmd}</code><button data-copy="${cmd}">복사</button></div>`).join('')}</div></details>`
}
const STATE_KO = { work: ['일하는 중', 'var(--work)'], help: [`${OWNER} 기다리는 중`, 'var(--help)'], rest: ['쉬는 중', 'var(--rest)'] }
function renderPanel(full = true) {

  if (isSub(e)) return renderSubPanel(e)
  const s = e.data, [label, color] = STATE_KO[e.zone] || ['퇴근 중', 'var(--dim)']
  const links = s.links.slice(-8).map((l) => `<a href="${esc(l.href)}" target="_blank" rel="noreferrer">${esc(l.kind === 'pr' ? 'PR #' + l.id : l.id)}</a>`).join(' ')
  const info = `
    <dl>
      <dt>상태</dt><dd><span class="badge" style="background:${color}">${s.state === 'stopped' ? '멈춤' : label}</span> ${s.kind === 'interactive' ? '(터미널 세션)' : ''}</dd>
      <dt>지금</dt><dd>${esc(s.detail || '기록 없음')}${s.phase === 'tool' ? ` <span style="color:var(--work)">[${esc(toolKo(s.tool))}]</span>` : ''}</dd>
      ${s.subagents.length ? `<dt>조수</dt><dd>${s.subagents.map((a) => `${esc(a.type)}: ${esc(a.description)}`).join('<br>')}</dd>` : ''}
      ${s.intent ? `<dt>받은 요청</dt><dd>${esc(clip(s.intent, 220))}</dd>` : ''}
      ${s.permissionMode ? `<dt>권한 모드</dt><dd>${esc(MODE_KO[s.permissionMode] || s.permissionMode)}</dd>` : ''}
      <dt>위치</dt><dd>${esc(s.project || '')}${s.worktree ? '<br>' + esc(s.worktree) : ''}</dd>
      <dt>토큰</dt><dd>${s.tokens.toLocaleString()} (Lv.${level(s.tokens)})</dd>
      <dt>마지막 활동</dt><dd>${ago(s.updatedAt)}</dd>
      <dt>시작</dt><dd>${ago(s.createdAt)}</dd>
      ${links ? `<dt>링크</dt><dd>${links}</dd>` : ''}
      <dt>세션</dt><dd>${esc(s.id)}</dd>

  if (!full && panel.querySelector('#info') && panel.dataset.extraKey === extraKey) { panel.querySelector('#info').innerHTML = info; panel.querySelector('h2').textContent = e.look.nick || s.name; return }
  panel.dataset.extraKey = extraKey
  panel.innerHTML = `<button class="x">×</button><h2></h2><div id="info">${info}</div>
    ${askBlock(e)}
    ${actsBlock(e)}

    <div class="dress">
      <label>별명</label><input type="text" id="fNick" maxlength="14" placeholder="${esc(clip(s.name, 14))}" value="${esc(e.look.nick)}">
      ${useSprites() ? `
      <label>몸</label><select id="fBody">${BODIES.map((n, i) => `<option value="${i}"${i === e.look.body ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <label>머리</label><select id="fHairStyle">${HAIRSTYLES.map((_, i) => `<option value="${i}"${i === e.look.hairStyle ? ' selected' : ''}>머리 ${i + 1}</option>`).join('')}<option value="-1"${e.look.hairStyle === -1 ? ' selected' : ''}>없음</option></select>
      <label>옷</label><select id="fOutfit">${OUTFITS.map((o, i) => `<option value="${i}"${i === e.look.outfit ? ' selected' : ''}>${o.name}</option>`).join('')}</select>
      <label>왕관</label><select id="fAcc"><option value="none">없음</option><option value="crown"${e.look.acc === 'crown' ? ' selected' : ''}>쓰기</option></select>` : `
      <label>머리</label><input type="color" id="fHair" value="${e.look.hair}">
      <label>피부</label><input type="color" id="fSkin" value="${e.look.skin}">
      <label>옷</label><input type="color" id="fShirt" value="${e.look.shirt}">
      <label>장식</label><select id="fAcc">${Object.entries(ACCS).map(([k, v]) => `<option value="${k}"${k === e.look.acc ? ' selected' : ''}>${v}</option>`).join('')}</select>`}
      <span></span><button id="fReset">처음 모습으로</button>
    </div>`
  panel.querySelector('h2').textContent = e.look.nick || s.name
  panel.style.display = 'block'
  panel.querySelector('.x').onclick = closePanel
  panel.querySelectorAll('[data-copy]').forEach((b) => { b.onclick = () => copyText(b.dataset.copy, b) })
  panel.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => doAct(b.dataset.act, e) })
  const bind = (id, key, num) => { const el = panel.querySelector(id); if (!el) return; el.oninput = (ev) => { e.look[key] = num ? Number(ev.target.value) : ev.target.value; e.sheet = null; saveLook(e); refreshLabels(e); panel.querySelector('h2').textContent = e.look.nick || s.name } }
  bind('#fNick', 'nick'); bind('#fHair', 'hair'); bind('#fSkin', 'skin'); bind('#fShirt', 'shirt'); bind('#fAcc', 'acc')
  bind('#fBody', 'body', true); bind('#fHairStyle', 'hairStyle', true); bind('#fOutfit', 'outfit', true)
  panel.querySelector('#fReset').onclick = () => { e.sheet = null; e.look = defaultLook(s); saveLook(e); refreshLabels(e); renderPanel() }
}
function renderSubPanel(e) {
  const s = e.data, parent = ents.get(s.parent)
  panel.innerHTML = `<button class="x">×</button><h2></h2><dl>
    <dt>역할</dt><dd><span class="badge" style="background:var(--work)">조수(서브에이전트)</span></dd>
    <dt>맡은 일</dt><dd>${esc(s.description || '기록 없음')}</dd>
    <dt>부른 세션</dt><dd>${esc(parent ? parent.look.nick || parent.data.name : s.parent)}</dd>
    <dt>마지막 기록</dt><dd>${ago(s.updatedAt)}</dd></dl>`
  panel.querySelector('h2').textContent = s.name
  panel.style.display = 'block'
  panel.querySelector('.x').onclick = closePanel
}
function copyText(text, btn) {
  const label = btn.textContent, done = () => { btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = label }, 1500) }
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); done() }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback()
}
function closePanel() { const prev = ents.get(selected); selected = null; panel.style.display = 'none'; if (prev) refreshLabels(prev) }

function pick(ev) {
  const r = cv.getBoundingClientRect(), mx = (ev.clientX - r.left) / scale, my = (ev.clientY - r.top) / scale
  let best = null
  for (const e of ents.values()) if (mx >= e.x - 3 && mx <= e.x + 15 && my >= (e.hy ?? e.y) - 5 && my <= e.y + 19 && (!best || e.y > best.y)) best = e
  return best
}
cv.addEventListener('mousemove', (ev) => { const e = pick(ev); hovered = e ? e.id : null; cv.style.cursor = e ? 'pointer' : 'default' })
cv.addEventListener('click', (ev) => {
  const e = pick(ev), prev = ents.get(selected)
  if (!e) return closePanel()
  selected = e.id; if (prev) refreshLabels(prev); refreshLabels(e); renderPanel()
})

/* ---------- 세션 제어 ---------- */
// 서버가 화면에 심어 준 토큰. 세션을 바꾸는 요청에는 이 값이 있어야 한다.
const TOKEN = '__TOWN_TOKEN__'
let knownDirs = []
async function act(name, body) {
  try {
    const res = await fetch('/api/action/' + name, { method: 'POST', headers: { 'content-type': 'application/json', 'x-town-token': TOKEN }, body: JSON.stringify(body) })
    const out = await res.json()
    toast(out.ok ? (out.output ? clip(out.output, 160) : '완료했어요') : '실패: ' + clip(out.output || '알 수 없는 오류', 200))
    poll()
    return out.ok
  } catch { toast('서버에 요청하지 못했어요'); return false }
}
const modal = document.getElementById('modal'), modalBox = modal.querySelector('.box')
function closeModal() { modal.style.display = 'none'; modalBox.innerHTML = '' }
modal.addEventListener('click', (ev) => { if (ev.target === modal) closeModal() })
function ask(title, message, okLabel) { // WKWebView 에서는 confirm() 이 조용히 실패하므로 직접 만든 확인 창을 쓴다
  return new Promise((resolve) => {
    modalBox.innerHTML = `<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="row"><button id="mNo">취소</button><button id="mYes" class="danger">${esc(okLabel)}</button></div>`
    modal.style.display = 'flex'
    modalBox.querySelector('#mNo').onclick = () => { closeModal(); resolve(false) }
    modalBox.querySelector('#mYes').onclick = () => { closeModal(); resolve(true) }
  })
}
async function doAct(name, e) {
  const s = e.data, label = e.look.nick || s.name
  if (name === 'attach') return act('attach', { id: s.id })
  if (name === 'stop' && await ask('세션을 멈출까요?', `‘${label}’ 이(가) 하던 일을 멈춥니다. 대화는 보존되어 나중에 이어 갈 수 있어요.`, '멈추기')) return act('stop', { id: s.id })
  if (name === 'remove' && await ask('세션을 지울까요?', `‘${label}’ 의 대화 기록을 지웁니다. 되돌릴 수 없어요. push 하지 않은 커밋이 있는 워크트리는 지워지지 않고 안내가 나옵니다.`, '지우기')) { if (await act('remove', { id: s.id })) closePanel() }
}
document.getElementById('newBtn').onclick = () => {
  if (!knownDirs.length) return toast('아직 세션이 돌았던 프로젝트 폴더가 없어요. 터미널에서 claude --bg 로 한 번 시작해 주세요.')
  modalBox.innerHTML = `<h2>새 세션 시작</h2>
    <label>어느 프로젝트에서</label><select id="mDir">${knownDirs.map((d) => `<option value="${esc(d)}">${esc(d.split('/').pop())} (${esc(d)})</option>`).join('')}</select>
    <label>시킬 일</label><textarea id="mPrompt" placeholder="예: README 오타를 찾아서 고쳐줘"></textarea>
    <p class="hint">백그라운드 세션(claude --bg)으로 시작합니다. 권한 모드는 Claude Code 설정을 따릅니다.</p>
    <div class="row"><button id="mNo">취소</button><button id="mYes" class="primary">시작</button></div>`
  modal.style.display = 'flex'
  modalBox.querySelector('#mPrompt').focus()
  modalBox.querySelector('#mNo').onclick = closeModal
  modalBox.querySelector('#mYes').onclick = async () => {
    const cwd = modalBox.querySelector('#mDir').value, prompt = modalBox.querySelector('#mPrompt').value.trim()
    if (!prompt) return toast('시킬 일을 적어 주세요')
    closeModal(); await act('start', { cwd, prompt })
  }
}

/* ---------- 알림 ---------- */
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg
  document.getElementById('toasts').append(el); setTimeout(() => el.remove(), 6000)
}
let soundOn = false, audio = null
try { soundOn = localStorage.getItem('town.sound') === '1' } catch {}
const soundBtn = document.getElementById('sound')
const paintSound = () => { soundBtn.textContent = soundOn ? '알림음 켜짐' : '알림음 꺼짐' }
soundBtn.onclick = () => { soundOn = !soundOn; try { localStorage.setItem('town.sound', soundOn ? '1' : '0') } catch {}; paintSound(); if (soundOn) beep(660) }
function beep(freq) {
  if (!soundOn) return
  try {
    audio ||= new AudioContext()
    const o = audio.createOscillator(), g = audio.createGain()
    o.type = 'square'; o.frequency.value = freq; g.gain.setValueAtTime(0.06, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.35)
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.35)
  } catch {}
}

/* ---------- 캐릭터 스타일 전환 ---------- */
const styleBtn = document.getElementById('style')
const paintStyle = () => { styleBtn.textContent = style === 'sprite' ? '캐릭터: 도트' : '캐릭터: 기본' }
styleBtn.onclick = () => { style = style === 'sprite' ? 'basic' : 'sprite'; try { localStorage.setItem('town.style', style) } catch {}; paintStyle(); if (selected) renderPanel() }
paintStyle()

/* ---------- 시작 ---------- */
function fit() {
  const aw = innerWidth - 40, ah = innerHeight - 52 - 36
  scale = Math.max(1, Math.floor(Math.min(aw / W, ah / H) * 2) / 2)
  document.documentElement.style.setProperty('--s', scale)
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px'
  labels.querySelectorAll('.zone').forEach((z) => { z.style.left = z.dataset.x * scale + 'px'; z.style.top = z.dataset.y * scale + 'px' })
}
for (const [text, x, y] of [['작업실', 4, 55], [`${OWNER} 호출 벨`, 388, 40], ['휴게실', 4, 217]]) {
  const z = document.createElement('div'); z.className = 'zone'; z.textContent = text; z.dataset.x = x; z.dataset.y = y; labels.append(z)
}
// 주소에 ?demo=1 을 붙이면 가짜 세션으로 자리와 가구 배치를 한눈에 확인할 수 있다.
const DEMO = new URLSearchParams(location.search).has('demo')
function demoSessions() {
  const mk = (i, state, extra = {}) => ({ id: 'demo' + i, kind: 'bg', name: `demo session ${i}`, state, detail: state === 'working' ? 'building the pixel office' : state === 'blocked' ? 'waiting for a decision' : '', intent: '', tokens: 3000 * (i + 1) ** 2, project: 'demo', worktree: null, createdAt: Date.now() - 3.6e6, updatedAt: Date.now() - (i % 3 ? 2 : 40) * 3.6e6, helpers: 0, links: [], subagents: [], permissionMode: i % 2 ? 'auto' : 'default', lastText: state === 'blocked' ? '배포 전에 확인이 필요합니다.\n1) 지금 바로 배포\n2) 내일 오전에 배포\n어느 쪽으로 할까요?' : null, pending: null, tool: 'Bash', phase: i % 2 ? 'tool' : 'thinking', ...extra })
  const sub = (id, type) => ({ id, type, description: 'demo task', at: Date.now() })
  return [mk(0, 'working', { subagents: [sub('a', 'Explore'), sub('b', 'frontend-developer'), sub('c', 'Plan')] }), mk(1, 'working'), mk(2, 'working', { subagents: [sub('d', 'general-purpose')] }), mk(3, 'working'), mk(4, 'working'),
    mk(5, 'blocked'), mk(6, 'blocked'), ...[...Array(17).keys()].map((k) => mk(7 + k, 'done'))]
}
async function poll() {
  if (DEMO) return sync(demoSessions())
  try {
    const res = await fetch('/api/sessions', { cache: 'no-store' })
    const data = await res.json()
    knownDirs = data.dirs || []
    sync(data.sessions)
    document.getElementById('offline').style.display = 'none'
  } catch { document.getElementById('offline').style.display = 'block' }
}
function tickClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) }
addEventListener('resize', fit)
paintSound(); fit(); paintBackground(); tickClock()
setInterval(paintBackground, 30000); setInterval(tickClock, 1000)
poll(); setInterval(poll, 2000)
requestAnimationFrame(frame)
</script>
</body>
