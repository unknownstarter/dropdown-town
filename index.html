<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown Town</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  :root { --bg:#1b1726; --ink:#f4efe6; --dim:#a79fb8; --panel:#2a2438; --line:#463d5c; --work:#ffb454; --help:#ff6b7a; --rest:#7fd1a8; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family: Galmuri11, ui-monospace, 'Apple SD Gothic Neo', monospace; font-size:13px; }
  header { height:52px; display:flex; align-items:center; gap:8px; padding:0 14px; border-bottom:2px solid var(--line); }
  header button, .chip { white-space:nowrap; }
  #rooms { display:flex; gap:4px; }
  .room { padding:3px 8px; border-color:var(--line); color:var(--dim); } .room.on { border-color:var(--work); color:var(--ink); } .room.off { opacity:.6; }
  .room b { font-weight:normal; color:var(--help); }
  h1 { font-size:16px; margin:0; letter-spacing:1px; }
  h1 span { color:var(--work); }
  .chip { padding:3px 9px; border:2px solid var(--line); border-radius:4px; background:var(--panel); white-space:nowrap; }
  .chip b { font-weight:normal; }
  .chip.work b { color:var(--work); } .chip.help b { color:var(--help); } .chip.rest b { color:var(--rest); }
  .grow { flex:1; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:4px; padding:3px 9px; cursor:pointer; }
  button:hover { border-color:var(--work); }
  #clock { color:var(--dim); }
  body { display:flex; flex-direction:column; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; padding:10px 12px; }
  #list { display:none; }
  /* 좁은 창(화면 옆 3분의 1 등): 위에는 사무실을 미니맵처럼, 아래에는 세션 카드 목록을 보여준다 */
  body.compact header { height:auto; flex-wrap:wrap; gap:6px; padding:8px 10px; font-size:11px; }
  body.compact h1 { font-size:14px; flex:1 0 auto; } body.compact .grow { display:none; }
  body.compact .chip, body.compact header button { padding:2px 6px; }
  body.compact main { padding:6px 8px 0; }
  body.compact #stage { border-width:2px; flex:none; }
  body.tiny .bubble { display:none !important; }
  .pan { position:absolute; top:50%; transform:translateY(-50%); width:22px; height:44px; padding:0; font-size:16px; line-height:1; background:rgba(20,16,30,.78); border-color:var(--line); display:none; z-index:2; }
  .pan.l { left:4px; } .pan.r { right:4px; }
  body.compact .pan.on { display:block; }
  body.compact #list { font-size:12px; }
  body.compact .zone { font-size:9px; padding:0 4px; }
  body.compact #list { display:block; flex:1; min-height:0; width:100%; overflow:auto; padding:8px 2px 12px; }
  body.compact #panel { left:8px; right:8px; width:auto; top:auto; bottom:8px; max-height:62vh; box-shadow:0 -8px 24px rgba(0,0,0,.5); }
  #list h3 { font-size:12px; margin:12px 4px 6px; font-weight:normal; display:flex; gap:6px; align-items:center; }
  #list h3 b { font-weight:normal; color:var(--dim); }
  .card { display:flex; gap:10px; align-items:flex-start; padding:8px; margin-bottom:6px; background:var(--panel); border:2px solid var(--line); border-radius:6px; cursor:pointer; }
  .card:hover, .card.sel { border-color:var(--work); }
  .card.help { border-color:var(--help); }
  .card .body { min-width:0; flex:1; }
  .card b { font-weight:normal; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card b i { font-style:normal; color:var(--work); margin-right:5px; font-size:11px; }
  .card p { margin:3px 0 0; font-size:12px; line-height:1.45; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card small { display:block; margin-top:3px; color:var(--dim); font-size:11px; }
  .card small em { font-style:normal; color:var(--work); }
  .empty { color:var(--dim); text-align:center; padding:24px 8px; line-height:1.6; }
  #stage { position:relative; border:4px solid #0e0b16; box-shadow:0 0 0 2px var(--line); }
  canvas { display:block; image-rendering:pixelated; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .zone { position:absolute; font-size:11px; color:rgba(40,28,20,.75); background:rgba(255,250,235,.55); padding:1px 6px; border-radius:3px; }
  .tag { position:absolute; transform:translate(-50%,0); font-size:10px; white-space:nowrap; padding:1px 5px;
    background:rgba(20,16,30,.82); border-radius:3px; max-width:calc(55px * var(--s)); overflow:hidden; text-overflow:ellipsis; }
  .tag i { font-style:normal; color:var(--work); margin-right:4px; }
  .tag.sel { outline:2px solid var(--work); }
  .tag.near { outline:2px solid #fff; display:block !important; }
  .tag.mini { font-size:9px; padding:0 3px; max-width:calc(36px * var(--s)); }
  .bubble { position:absolute; transform:translate(-50%,-100%); width:max-content; max-width:calc(60px * var(--s)); font-size:11px; line-height:1.35;
    background:#fffdf6; color:#2a2233; border:2px solid #2a2233; border-radius:6px; padding:3px 6px; }
  .bubble span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bubble { max-width:calc(68px * var(--s)); } .bubble span { -webkit-line-clamp:1; } /* 책상 줄 간격이 좁아 한 줄만, 전체 내용은 패널에서 */
  .bubble.two span { -webkit-line-clamp:2; }
  .bubble.sub { max-width:calc(46px * var(--s)); font-size:10px; } /* 조수 말풍선은 부모 것과 겹치지 않게 작게 */
  .bubble.help { border-color:#b8404e; background:#fff0f1; }
  .bubble.help { max-width:calc(47px * var(--s)); } .bubble.help span { -webkit-line-clamp:1; }
  .bubble em { font-style:normal; color:#b35c00; } .bubble u { text-decoration:none; } .bubble .c { display:none; }
  body.compact .bubble .d { display:none; } body.compact .bubble .c { display:inline; } body.compact .bubble { padding:1px 5px; font-size:10px; } body.compact .bubble.help em { color:#b8404e; } body.compact .bubble { max-width:none; }
  #panel { position:fixed; z-index:5; top:64px; right:12px; width:320px; max-height:calc(100vh - 80px); overflow:auto; display:none;
    background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:14px; }
  #panel h2 { font-size:14px; margin:0 24px 8px 0; line-height:1.4; }
  #panel .x { position:absolute; top:8px; right:8px; padding:0 6px; }
  #panel dl { margin:0; display:grid; grid-template-columns:72px 1fr; gap:6px 8px; }
  #panel dt { color:var(--dim); } #panel dd { margin:0; word-break:break-word; line-height:1.45; }
  #panel a { color:var(--work); }
  #panel h3 { font-size:12px; color:var(--dim); margin:14px 0 8px; border-top:2px solid var(--line); padding-top:10px; font-weight:normal; }
  .badge { display:inline-block; padding:1px 7px; border-radius:3px; color:#1b1726; }
  .dress { display:grid; grid-template-columns:72px 1fr; gap:6px 8px; align-items:center; }
  .dress input[type=color] { width:44px; height:24px; padding:0; border:2px solid var(--line); background:none; }
  .dress input[type=text], .dress select { font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:3px 6px; width:100%; }
  .cmds div { display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin-bottom:8px; align-items:center; }
  .cmds span { grid-column:1 / 3; color:var(--dim); font-size:11px; }
  .cmds code { background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:3px 6px; font-family:inherit; user-select:all; }
  .rrow { display:flex; gap:10px; align-items:center; padding:6px; border:2px solid transparent; border-radius:4px; cursor:pointer; }
  .rrow:hover { border-color:var(--work); background:var(--bg); }
  .rrow b { font-weight:normal; display:block; } .rrow small, .tasks small { display:block; color:var(--dim); font-size:11px; line-height:1.5; } .rrow small.on { color:var(--work); }
  .rhead { display:flex; gap:12px; align-items:center; margin:10px 0 12px; }
  .rsel { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:4px 6px; margin-bottom:8px; }
  .tasks { margin:0; padding-left:16px; } .tasks li { margin-bottom:8px; line-height:1.45; }
  #rBack { margin-bottom:4px; }
  .ask { margin-top:10px; background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:8px; max-height:220px; overflow:auto; white-space:pre-wrap; word-break:break-word; line-height:1.5; font-size:12px; }
  .ask.help { border-color:var(--help); }
  .hint { color:var(--dim); font-size:11px; line-height:1.5; margin:8px 0 0; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; }
  button.danger:hover { border-color:var(--help); color:var(--help); }
  button.primary { border-color:var(--work); color:var(--work); }
  details { margin-top:10px; } summary { color:var(--dim); font-size:11px; cursor:pointer; margin-bottom:8px; }
  #modal { position:fixed; inset:0; background:rgba(10,8,16,.7); display:none; align-items:center; justify-content:center; z-index:10; }
  #modal .box { width:min(440px, calc(100vw - 32px)); background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:16px; }
  #modal h2 { font-size:14px; margin:0 0 10px; } #modal p { margin:0 0 12px; line-height:1.55; color:var(--ink); }
  #modal label { display:block; color:var(--dim); font-size:11px; margin:10px 0 4px; }
  #modal select, #modal textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:6px; }
  #modal textarea { height:110px; resize:vertical; }
  #modal .row { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  #chatbar { width:100%; max-width:calc(480px * var(--s) + 8px); margin-top:6px; }
  #chatlog { display:flex; flex-direction:column; gap:2px; margin-bottom:4px; font-size:11px; color:var(--dim); line-height:1.4; max-height:64px; overflow:auto; }
  #chatlog b { font-weight:normal; color:var(--work); margin-right:4px; } #chatlog .mine b { color:var(--rest); }
  #chatform { display:flex; gap:6px; } #chatform input { flex:1; font:inherit; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:4px; padding:4px 8px; }
  #chatform input:focus { border-color:var(--work); outline:none; }
  .bubble.chat { background:#fff; border-color:#2a2233; max-width:calc(80px * var(--s)); } .bubble.chat span { -webkit-line-clamp:3; } body.compact .bubble.chat .d { display:inline; }
  #toasts { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; }
  .toast { background:#fffdf6; color:#2a2233; border:2px solid #2a2233; border-radius:6px; padding:6px 12px; }
  #offline { display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); background:var(--help); color:#1b1726; padding:4px 12px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1><span>*</span> Dropdown Town</h1>
  <div id="rooms"></div>
  <div class="chip work">일하는 중 <b id="nWork">0</b></div>
  <div class="chip help"><span id="ownerChip">마스터 기다리는 중</span> <b id="nHelp">0</b></div>
  <div class="chip rest">쉬는 중 <b id="nRest">0</b></div>
  <div class="grow"></div>
  <span id="clock"></span>
  <span class="chip" id="relayChip" style="display:none"><b id="relayText"></b> <button id="relayStop" class="danger" style="padding:0 6px;margin-left:6px">멈춤</button></span>
  <button id="teamBtn">팀</button>
  <button id="relayBtn">릴레이</button>
  <button id="rosterBtn">직원 명부</button>
  <button id="newBtn">+ 새 세션</button>
  <button id="style">캐릭터: 도트</button>
  <button id="sound">알림음 꺼짐</button>
</header>
<main><div id="stage"><canvas id="cv" width="480" height="300"></canvas><div id="labels"></div><button class="pan l" id="panL" title="왼쪽 보기">‹</button><button class="pan r" id="panR" title="오른쪽 보기">›</button></div>
<div id="chatbar"><div id="chatlog"></div><form id="chatform"><input id="chatin" maxlength="120" placeholder="같은 방 사람들에게 한마디 (Enter 나 / 키로 바로 입력)" autocomplete="off"><button type="submit">보내기</button></form></div>
<div id="list"></div></main>
<aside id="panel"></aside>
<div id="toasts"></div>
<div id="modal"><div class="box"></div></div>
<div id="offline">서버와 연결이 끊겼어요. node server.mjs 가 켜져 있는지 확인해 주세요.</div>

<script>
const W = 480, H = 300
let SPEED = 60
// 화면에서 사용자를 부르는 호칭. 주소에 ?owner=대장 처럼 붙이면 바뀌고 그 뒤로 기억한다.
let OWNER = '마스터'
try { const q = new URLSearchParams(location.search).get('owner'); if (q) localStorage.setItem('town.owner', q.slice(0, 8)); OWNER = localStorage.getItem('town.owner') || OWNER } catch {}
document.getElementById('ownerChip').textContent = `${OWNER} 기다리는 중`
const cv = document.getElementById('cv'), ctx = cv.getContext('2d')
ctx.imageSmoothingEnabled = false
const labels = document.getElementById('labels'), panel = document.getElementById('panel')
let scale = 2

const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h) }
const hash = (s) => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) } return h >>> 0 }
const shade = (hex, f) => '#' + [1, 3, 5].map((i) => Math.max(0, Math.min(255, Math.round(parseInt(hex.slice(i, i + 2), 16) * f))).toString(16).padStart(2, '0')).join('')
const hsl2hex = (h, s, l) => { const a = s * Math.min(l, 1 - l); const f = (n) => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0') }; return '#' + f(0) + f(8) + f(4) }

/* ---------- 자리 배치 ---------- */
// 위쪽이 작업실(오른쪽 빨간 카펫은 호출 구역), 아래쪽이 휴게실이다. 두 방은 벽으로 나뉘고 GATE_X 의 문틈으로만 오간다.
const LANES = { work: 158, lounge: 218 }, GATE_X = 342
const deskPos = (i) => ({ x: 14 + (i % 4) * 72, y: 78 + Math.floor(i / 4) * 54 })
// 휴게실 자리: face 는 앉아서 바라보는 방향, kind 는 가구 종류. 여러 가구에 골고루 앉도록 순서를 섞어 두었다.
const TV_SEAT = (k) => ({ x: 38 + k * 15, y: 250, face: 'up', kind: 'sofaBack' })
const LOW_SEAT = (x0, k) => ({ x: x0 + 3 + k * 15, y: 268, face: 'down', kind: 'sofa' })
const REST = [
  TV_SEAT(1), { x: 131, y: 226, face: 'right', kind: 'sofa' }, { x: 249, y: 210, face: 'up', kind: 'arcade' }, LOW_SEAT(300, 1),
  { x: 191, y: 226, face: 'left', kind: 'sofa' }, TV_SEAT(0), LOW_SEAT(370, 1), { x: 432, y: 240, face: 'down', kind: 'bag' },
  { x: 271, y: 210, face: 'up', kind: 'arcade' }, LOW_SEAT(300, 0), { x: 131, y: 244, face: 'right', kind: 'sofa' }, TV_SEAT(2),
  LOW_SEAT(370, 0), { x: 191, y: 244, face: 'left', kind: 'sofa' }, LOW_SEAT(300, 2), LOW_SEAT(370, 2), { x: 454, y: 262, face: 'down', kind: 'bag' },
]
const SPOTS = {
  work: (i) => {
    if (i >= 8) return { x: 300, y: 70 + (i - 8) * 26, aisle: null, room: 'work', face: 'down' } // 책상이 모자라면 복도에 서서 일한다
    const d = deskPos(i); return { x: d.x + 18, y: d.y - 14, aisle: d.x + 54, room: 'work', face: 'down' }
  },
  help: (i) => ({ x: 380 + (i % 2) * 48, y: 84 + i * 26, aisle: null, room: 'work', face: 'down' }),
  rest: (i) => ({ aisle: null, room: 'lounge', ...(REST[i] || { x: 100 + ((i - REST.length) % 8) * 22, y: 276, face: 'down', kind: 'bag' }) }),
}
// 서브에이전트(조수)는 부모 세션의 책상 오른쪽에 선다. 부모가 책상에 없으면 그 옆에 선다.
function subSpot(parent, k) {
  if (parent.zone === 'work' && parent.slot < 8) { const d = deskPos(parent.slot); return { x: d.x + 50 + k * 8, y: d.y - 12 + k * 6, aisle: d.x + 54, room: 'work', face: 'left' } }
  return { x: parent.spot.x + 14 + k * 10, y: parent.spot.y, aisle: null, room: parent.spot.room, face: 'left' }
}
const slots = { work: [], help: [], rest: [] }
function takeSlot(zone, id) {
  const arr = slots[zone]
  let i = arr.indexOf(null)
  if (i === -1) i = arr.length
  arr[i] = id
  return i
}
function freeSlot(e) { if (e.zone && slots[e.zone]) slots[e.zone][e.slot] = null }

const zoneOf = (s) => (s.state === 'working' ? 'work' : ['done', 'idle', 'stopped'].includes(s.state) ? 'rest' : 'help') // 모르는 상태는 눈에 띄게 호출 구역으로

function route(from, to) {
  const pts = [], fromRoom = from.room || 'work', toRoom = to.room || 'work'
  let x = from.x
  if (from.aisle != null) { pts.push({ x: from.aisle, y: from.y }); x = from.aisle }
  pts.push({ x, y: LANES[fromRoom] })
  if (fromRoom !== toRoom) { pts.push({ x: GATE_X, y: LANES[fromRoom] }); pts.push({ x: GATE_X, y: LANES[toRoom] }) }
  const tx = to.aisle != null ? to.aisle : to.x
  pts.push({ x: tx, y: LANES[toRoom] })
  if (to.aisle != null) pts.push({ x: tx, y: to.y })
  pts.push({ x: to.x, y: to.y })
  return pts
}

/* ---------- 캐릭터 생김새 ---------- */
const HAIRS = ['#2b2230', '#5a3a22', '#8a5a2b', '#d9a441', '#c0392b', '#6b6b7a', '#e8e0d0', '#3b4a8a']
const SKINS = ['#f7d7b5', '#f0c29a', '#d9a377', '#b07a50', '#8a5a3a']
const ACCS = { none: '없음', cap: '모자', headphones: '헤드폰', shades: '선글라스', crown: '왕관', cat: '고양이 귀' }
function defaultLook(s) {
  const h = hash(s.id)
  const accKeys = ['none', 'none', 'cap', 'headphones', 'shades', 'cat']
  return {
    hair: HAIRS[h % HAIRS.length], skin: SKINS[(h >>> 4) % SKINS.length],
    shirt: hsl2hex((h >>> 8) % 360, 0.55, 0.55),
    acc: s.kind === 'interactive' || s.kind === 'me' ? 'crown' : accKeys[(h >>> 16) % accKeys.length], nick: '',
    body: hash(s.id + 'body') % 6, outfit: s.kind === 'sub' ? 13 : hash(s.id + 'outfit') % 11, hairStyle: hash(s.id + 'hair') % 12, // 도트 캐릭터용(모자 달린 옷은 직접 고를 때만)
  }
}
function loadLook(s) {
  try { return { ...defaultLook(s), ...JSON.parse(localStorage.getItem('town.look.' + s.id) || '{}') } } catch { return defaultLook(s) }
}
// 생김새는 열쇠마다 하나만 만들어 같이 쓴다. 세션은 세션 id, 서브에이전트는 'agent:직군 이름' 이 열쇠라서
// 같은 직군은 언제 어느 세션에 불려 와도 같은 얼굴이고, 명부에서 꾸미면 사무실 캐릭터도 같이 바뀐다.
const looks = new Map(), sheets = new WeakMap()
function lookFor(key, s) { if (!looks.has(key)) looks.set(key, loadLook({ ...s, id: key })); return looks.get(key) }
function saveLook(key) { sheets.delete(looks.get(key)); try { localStorage.setItem('town.look.' + key, JSON.stringify(looks.get(key))) } catch {} }
function resetLook(key, s) { sheets.delete(looks.get(key)); Object.assign(looks.get(key), defaultLook({ ...s, id: key })); saveLook(key) }

function drawChar(c, x, y, look, pose, t, seed) {
  const f2 = Math.floor(t / 180 + seed) % 2, s2 = Math.floor(t / 600 + seed) % 2
  const dark = '#2a2233', pants = '#3a3550'
  let yy = y
  if (pose === 'walk' && f2) yy -= 1
  if (pose === 'alert' && f2) yy -= 2

const cat = { x: 170, y: 262, tx: 170, ty: 262, mode: 'sit', until: 0, dir: 1 }
function stepCat(t, dt) {
  if (t > cat.until) {
    const roll = Math.random()
    if (roll < 0.25) { cat.mode = 'walk'; cat.tx = 160; cat.ty = 258; cat.next = 'sleep' } // 벽난로 앞으로
    else if (roll < 0.8) { cat.mode = 'walk'; cat.tx = 100 + Math.random() * 190; cat.ty = 252 + Math.random() * 38; cat.next = 'sit' }
    else cat.mode = 'sit'
    cat.until = t + 4000 + Math.random() * 9000
  }
  if (cat.mode === 'walk') {
    const dx = cat.tx - cat.x, dy = cat.ty - cat.y, d = Math.hypot(dx, dy)
    if (d < 1) { cat.mode = cat.next; cat.until = t + (cat.next === 'sleep' ? 20000 : 5000) + Math.random() * 8000 }
    else { cat.x += (dx / d) * 22 * dt; cat.y += (dy / d) * 22 * dt; cat.dir = dx >= 0 ? 1 : -1 }
  }
}
function drawCat(c, t) {
  const x = Math.round(cat.x), y = Math.round(cat.y), o = '#e8923a', d = '#b8651f', f = Math.floor(t / 160) % 2
  R(c, x, y + 7, 10, 1, 'rgba(0,0,0,.2)')

  const hx = cat.dir > 0 ? x + 6 : x
  R(c, x + 2, y + 3, 7, 3, o); R(c, hx, y + 1, 4, 4, o); R(c, hx, y, 1, 1, d); R(c, hx + 3, y, 1, 1, d); R(c, hx + (cat.dir > 0 ? 2 : 1), y + 2, 1, 1, '#2a2233')
  R(c, cat.dir > 0 ? x : x + 9, y + 1 + (Math.floor(t / 300) % 2), 1, 3, d)
  if (cat.mode === 'walk') { R(c, x + 2 + f, y + 6, 1, 1, d); R(c, x + 7 - f, y + 6, 1, 1, d) } else { R(c, x + 3, y + 6, 1, 1, d); R(c, x + 7, y + 6, 1, 1, d) }

const DOOR = { x: 336, y: 38, aisle: null, room: 'work', face: 'down' }
const ents = new Map()
let firstLoad = true, selected = null, hovered = null
const entsIn = (zone) => { let n = 0; for (const e of ents.values()) if (e.zone === zone) n++; return n }

function makeEnt(s) {
  const e = { id: s.id, data: s, zone: null, slot: -1, x: DOOR.x, y: DOOR.y, path: [], spot: DOOR, lookKey: s.lookKey || s.id, look: lookFor(s.lookKey || s.id, s.lookKey ? { kind: s.role ? 'role' : 'sub' } : s), seed: hash(s.id) % 97, dir: 'down' }
  e.tag = document.createElement('div'); e.tag.className = 'tag'
  e.bubble = document.createElement('div'); e.bubble.className = 'bubble'
  labels.append(e.tag, e.bubble)
  ents.set(s.id, e)
  return e
}
function walkTo(e, spot, teleport) {
  if (teleport) { e.x = spot.x; e.y = spot.y; e.path = [] }
  else e.path = route(e.path.length ? { x: e.x, y: e.y, aisle: null, room: e.y > 190 ? 'lounge' : 'work' } : e.spot, spot)
  e.spot = spot
}
function moveTo(e, zone, teleport) {
  freeSlot(e)
  e.zone = zone; e.slot = takeSlot(zone, e.id)
  walkTo(e, SPOTS[zone](e.slot), teleport)
}
function leave(e) { e.leaving = true; freeSlot(e); e.zone = null; walkTo(e, DOOR, false) }

const TOOL_KO = { Bash: '터미널', Edit: '코드 수정', Write: '파일 작성', Read: '파일 읽기', Grep: '검색', Glob: '검색', Agent: '조수 부르기', Task: '조수 부르기', WebFetch: '웹 조회', WebSearch: '웹 검색', Skill: '스킬', Artifact: '페이지 만들기', ToolSearch: '도구 찾기' }
const toolKo = (n) => !n ? '' : TOOL_KO[n] || (n.includes('playwright') || n.includes('browser') ? '브라우저' : n.startsWith('mcp__') ? n.split('__')[1] : n)
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]))
const level = (tokens) => 1 + Math.floor(Math.log2(tokens / 1000 + 1))
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s)
const isSub = (e) => e.data.kind === 'sub'

function refreshLabels(e) {
  const s = e.data, name = e.look.nick || s.name
  const extra = !isSub(e) && s.subagents.length > 2 ? ` +${s.subagents.length - 2}` : ''
  e.tag.classList.toggle('mini', isSub(e))
  e.tag.classList.toggle('near', nearId === e.id)
  e.tag.innerHTML = e.id === ME || s.kind === 'guest' ? `<i>${s.kind === 'guest' && !s.owner ? '☆' : '★'}</i>${esc(e.id === ME ? myName() : name)}` : isSub(e) ? `${s.role ? '' : '<i>조수</i>'}${esc(name)}` : `<i>${s.relay ? `릴레이 ${s.relay.step}/${s.relay.total}` : 'Lv.' + level(s.tokens)}</i>${esc(name)}${extra}`
  e.tag.classList.toggle('sel', selected === e.id)
  let html = ''
  // .d 는 넓은 창에서만, .c 는 좁은 창에서만 보인다(좁은 창에서는 짧은 상태만 띄우고 자세한 내용은 카드 목록이 맡는다)
  if (e.zone === 'work') { const tk = s.phase === 'tool' ? toolKo(s.tool) : s.phase === 'thinking' ? '생각 중' : ''; html = (tk ? `<em>[${esc(tk)}]</em>` : '<em class="c">일하는 중</em>') + `<u class="d"> ${esc(s.detail || '')}</u>` }
  else if (e.id === ME || s.kind === 'guest') { if (s.say && Date.now() - (s.sayAt || 0) < 9000) html = `<u class="d">${esc(s.say)}</u>` } // 채팅 말풍선은 9초 동안
  else if (isSub(e) && !e.path.length) { const tk = s.phase === 'tool' ? toolKo(s.tool) : '생각 중'; html = `<em>[${esc(tk)}]</em><u class="d"> ${esc((s.lastText || s.description || '').replace(/\s+/g, ' '))}</u>` }
  else if (e.zone === 'help') html = `<em class="c">답이 필요해요</em><u class="d">${esc(s.detail || '답을 기다리고 있어요')}</u>`
  e.bubble.className = 'bubble' + (e.zone === 'help' ? ' help' : '') + (e.zone === 'work' && e.slot < 4 ? ' two' : '') + (isSub(e) ? ' sub' : '') + (e.id === ME || s.kind === 'guest' ? ' chat' : '') // 윗줄 책상은 말풍선 위가 벽이라 두 줄까지 보여준다
  e.bubble.innerHTML = html ? `<span>${html}</span>` : ''
  e.bubble.dataset.empty = html ? '' : '1'
}

const lastSeenMsg = new Map(), planes = [], recentPlanes = new Map(), talkLinks = new Map()
// 메시지 상대 이름으로 캐릭터를 찾는다: 조수는 에이전트 id, 세션은 세션 이름이나 짧은 id 로 불린다.
const peerEnt = (peer) => ents.get('sub-' + peer) || ents.get(peer) || [...ents.values()].find((e) => !isSub(e) && !e.leaving && e.data.name === peer)
const nameOfAgent = (id) => { const sub = ents.get('sub-' + id); return sub ? sub.look.nick || sub.data.name : id }
function sync(list) {
  const seen = new Set()
  for (const s of list) {
    seen.add(s.id)
    let e = ents.get(s.id)
    const zone = zoneOf(s)
    if (!e) { e = makeEnt(s); moveTo(e, zone, firstLoad); if (!firstLoad) toast(`‘${s.name}’ 이(가) 출근했어요`) }
    else {
      e.data = s
      if (zone !== e.zone && !e.leaving) {
        moveTo(e, zone, false)
        if (zone === 'help') { toast(`‘${e.look.nick || s.name}’ 이(가) 호출 벨을 눌렀어요`); beep(880); panTo(W, 12000) }
        if (zone === 'rest') { toast(`‘${e.look.nick || s.name}’ 작업이 끝났어요`); beep(523) }
      }
    }
    refreshLabels(e)
    // 서브에이전트는 작업모를 쓴 조수로 등장한다(책상 옆 자리가 둘뿐이라 둘까지만 그리고, 나머지는 이름표에 +N)
    s.subagents.slice(0, 2).forEach((a, k) => {
      const role = agentIndex.get(a.type)?.scope !== 'builtin' && agentIndex.has(a.type)
      const id = 'sub-' + a.id, data = { id, kind: 'sub', role, lookKey: 'agent:' + a.type, name: a.type, parent: s.id, description: a.description, updatedAt: a.at, tokens: 0, subagents: [], tool: a.tool, phase: a.phase, lastText: a.lastText, instruction: a.instruction }
      seen.add(id)
      let sub = ents.get(id)
      const spot = subSpot(e, k)
      if (!sub) { sub = makeEnt(data); sub.zone = 'sub'; walkTo(sub, spot, firstLoad) }
      else { sub.data = data; if (!sub.leaving && (spot.x !== sub.spot.x || spot.y !== sub.spot.y)) walkTo(sub, spot, false) }
      refreshLabels(sub)
    })
  }
  // 새로 오간 메시지마다 보낸 쪽에서 받은 쪽으로 종이비행기를 날리고, 세션끼리 주고받았으면 둘 사이에 대화 줄을 잇는다.
  // 같은 메시지가 보낸 쪽(out)과 받은 쪽(in) 기록에 모두 남으므로 15초 안의 같은 쌍은 한 번만 날린다.
  for (const s of list) {
    const talks = s.talks || [], seenAt = lastSeenMsg.get(s.id) ?? (firstLoad ? Math.max(0, ...talks.map((t) => t.at)) : 0)
    for (const t of talks) {
      if (t.at <= seenAt) continue
      const me = ents.get(s.id), other = peerEnt(t.peer)
      const [from, to] = t.dir === 'in' ? [other, me] : [me, other]
      if (!from || !to || from === to) continue
      const pair = `${from.id}>${to.id}`
      if (Date.now() - (recentPlanes.get(pair) || 0) < 15000) continue
      recentPlanes.set(pair, Date.now())
      planes.push({ from, to, t0: performance.now() })
      if (!isSub(from) && !isSub(to)) talkLinks.set([from.id, to.id].sort().join('|'), Date.now())
      toast(`‘${from.look.nick || from.data.name}’ 이(가) ‘${to.look.nick || to.data.name}’ 에게 ${t.handback ? '결과를 넘겼어요' : '메시지를 보냈어요'}`)
    }
    lastSeenMsg.set(s.id, Math.max(seenAt, ...talks.map((t) => t.at)))
  }
  seen.add(ME); ensureAvatar()
  for (const e of ents.values()) if (!seen.has(e.id) && !e.leaving && e.data.kind !== 'guest') leave(e) // 방문자 아바타는 syncGuests 가 따로 관리한다
  const preselect = firstLoad && new URLSearchParams(location.search).get('select') // 주소의 ?select=세션id 로 그 캐릭터 패널을 연 채 시작한다
  if (preselect && ents.has(preselect)) { selected = preselect; renderPanel() }
  const rosterParam = firstLoad ? new URLSearchParams(location.search).get('roster') : null // ?roster 또는 ?roster=직군 으로 명부를 연 채 시작한다
  if (rosterParam !== null) openRoster(rosterParam || null)
  firstLoad = false
  const n = { work: entsIn('work'), help: entsIn('help'), rest: entsIn('rest') }
  nWork.textContent = n.work; nHelp.textContent = n.help; nRest.textContent = n.rest
  document.title = (n.help ? `(${n.help}) ` : '') + 'Dropdown Town'
  if (selected && ents.has(selected)) renderPanel(false)
  renderList(false)
}

function step(e, dt) {
  let left = SPEED * dt
  while (left > 0 && e.path.length) {
    const p = e.path[0], dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy)
    if (d > 0.01) e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'
    if (d <= left) { e.x = p.x; e.y = p.y; e.path.shift(); left -= d }
    else { e.x += (dx / d) * left; e.y += (dy / d) * left; left = 0 }
  }

  walkAvatarTo((ev.clientX - r.left) / scale + Math.round(view.x), (ev.clientY - r.top) / scale) // 빈 바닥을 누르면 아바타가 그리로 걸어간다
})

/* ---------- 아바타: 사무실을 돌아다니는 나 ---------- */
// 세션 캐릭터는 위치가 곧 상태라 손으로 옮기지 않는다. 대신 사람마다 아바타 하나를 두고 방향키(또는 WASD), 클릭, 터치로 움직인다.
// 세션 캐릭터 옆에 가면 이름표가 켜지고, Enter 나 스페이스로 그 캐릭터의 정보를 연다. 위치는 이 창에 저장된다.
const ME = 'me', AVATAR_SPEED = 75, NEAR = 26
const FLOORS = [{ x0: 4, x1: 476, y0: 56, y1: 172 }, { x0: 4, x1: 476, y0: 216, y1: 292 }, { x0: 334, x1: 356, y0: 160, y1: 230 }] // 작업실, 휴게실, 두 방 사이 문틈
const onFloor = (x, y) => FLOORS.some((f) => x >= f.x0 && x <= f.x1 && y >= f.y0 && y <= f.y1)
const keys = new Set()
let nearId = null
function ensureAvatar() {
  if (ents.has(ME)) return ents.get(ME)
  let pos = { x: 300, y: 250 }
  try { pos = { ...pos, ...JSON.parse(localStorage.getItem('town.me.pos') || '{}') } } catch {}
  if (!onFloor(pos.x, pos.y)) pos = { x: 300, y: 250 }
  const me = makeEnt({ id: ME, kind: 'me', name: OWNER, state: 'idle', detail: '', intent: '', tokens: 0, subagents: [], links: [], talks: [] })
  me.zone = 'me'; me.x = pos.x; me.y = pos.y; me.spot = { x: pos.x, y: pos.y, face: 'down', room: pos.y > 190 ? 'lounge' : 'work' }
  refreshLabels(me)
  return me
}
function walkAvatarTo(x, y) {
  const me = ents.get(ME)
  if (!me || !onFloor(x, y)) return
  const from = { x: me.x, y: me.y, aisle: null, room: me.y > 190 ? 'lounge' : 'work' }, to = { x: x - 6, y: y - 10, aisle: null, room: y > 190 ? 'lounge' : 'work', face: me.dir }
  me.path = from.room === to.room ? [{ x: to.x, y: to.y }] : route(from, to) // 다른 방이면 문틈으로 돌아간다
  me.spot = to
}
function stepAvatar(me, dt) {
  const dx = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0)
  const dy = (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0)
  me.moving = dx !== 0 || dy !== 0
  if (me.moving) {
    me.path = []
    const len = Math.hypot(dx, dy), nx = me.x + (dx / len) * AVATAR_SPEED * dt, ny = me.y + (dy / len) * AVATAR_SPEED * dt
    if (onFloor(nx + 6, me.y + 10)) me.x = nx // 벽에는 막히되 벽을 따라 미끄러지게 축을 따로 본다
    if (onFloor(me.x + 6, ny + 10)) me.y = ny
    me.dir = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'
    me.spot = { x: me.x, y: me.y, face: me.dir, room: me.y > 190 ? 'lounge' : 'work' }
  }
  if ((me.moving || me.path.length) && compact) focusOn(me, 2500)
  if (rooms.length > 1 && me.y < 60 && me.x > 322 && me.x < 362 && performance.now() - lastRoomSwitch > 1500) { me.y = 68; me.path = []; switchRoom((room + 1) % rooms.length) } // 문으로 나가면 옆 방으로
  if (me.moving || me.path.length) me.dirty = true
  else if (me.dirty) { me.dirty = false; try { localStorage.setItem('town.me.pos', JSON.stringify({ x: Math.round(me.x), y: Math.round(me.y) })) } catch {} }
  pushAvatar(me, me.moving || me.path.length > 0)
  // 가까운 캐릭터: 이름표를 켜고 Enter 로 열 수 있게 한다
  let best = null, bestD = NEAR
  for (const e of ents.values()) { if (e === me || e.leaving) continue; const d = Math.hypot(e.x - me.x, e.y - me.y); if (d < bestD) { best = e; bestD = d } }
  const id = best ? best.id : null
  if (id !== nearId) { const prev = ents.get(nearId); nearId = id; if (prev) refreshLabels(prev); if (best) refreshLabels(best) }
}
const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') || modal.style.display === 'flex' }
addEventListener('keydown', (ev) => {
  if (typing()) return
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(ev.code)) { keys.add(ev.code); ev.preventDefault() }
  // Enter: 동료 방에서는 채팅 입력, 내 사무실에서는 옆에 세션 캐릭터가 있으면 열고 아니면 채팅 입력. 스페이스는 늘 옆 캐릭터 열기.
  if (ev.code === 'Enter') { ev.preventDefault(); if (room === 0 && nearId && ents.get(nearId)?.data.kind !== 'guest') selectEnt(nearId); else document.getElementById('chatin').focus() }
  if (ev.code === 'Space' && nearId) { ev.preventDefault(); selectEnt(nearId) }

// 방 채팅: 보내면 내 아바타 위에 말풍선이 뜨고, 서버를 거쳐 같은 방 사람들에게도 보인다
document.getElementById('chatform').onsubmit = (ev) => {

const chatSeen = new Set()

// 아바타와 채팅에 쓰는 내 이름: 별명이 있으면 별명, 없으면 팀 창의 내 이름(기본은 맥 이름). 호칭 "마스터"는 모두가 같아서 쓰지 않는다.

addEventListener('keyup', (ev) => keys.delete(ev.code))
addEventListener('blur', () => keys.clear())
// 터치: 살짝 두드리면 그 자리로 걷거나 캐릭터를 열고, 옆으로 끌면 카메라를 움직인다
let touch = null
cv.addEventListener('touchstart', (ev) => { const t = ev.touches[0]; touch = { x0: t.clientX, y0: t.clientY, cam0: view.x, moved: false } }, { passive: true })
cv.addEventListener('touchmove', (ev) => {

// 서버가 화면에 심어 준 토큰. 세션을 바꾸는 요청에는 이 값이 있어야 한다.
const TOKEN = '__TOWN_TOKEN__'
let knownDirs = [], recentDirs = [], HOME = ''
async function act(name, body) {
  try {
    const res = await fetch('/api/action/' + name, { method: 'POST', headers: { 'content-type': 'application/json', 'x-town-token': TOKEN }, body: JSON.stringify(body) })
    if (res.status === 403) { toast('서버가 다시 켜져서 화면을 새로 고칩니다. 한 번 더 눌러 주세요.'); setTimeout(() => location.reload(), 1200); return false } // 서버가 재시작되면 토큰이 바뀐다
    const out = await res.json()
    toast(out.ok ? (out.output ? clip(out.output, 160) : '완료했어요') : '실패: ' + clip(out.output || '알 수 없는 오류', 200))
    poll()
    return out.ok
  } catch { toast('서버에 요청하지 못했어요'); return false }
}
const modal = document.getElementById('modal'), modalBox = modal.querySelector('.box')

  return new Promise((resolve) => {
    modalBox.innerHTML = `<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="row"><button id="mNo">취소</button><button id="mYes" class="danger">${esc(okLabel)}</button></div>`

    modalBox.querySelector('#mNo').onclick = () => { closeModal(); resolve(false) }

}

/* ---------- 릴레이(자율 사무실 첫 버전) ---------- */
// 사람이 한 번 시작하면 단계마다 새 세션이 열리고 앞 단계의 마지막 말이 다음 단계로 넘어간다. 막히면 호출 벨로 나오고 언제든 멈출 수 있다.
let relayState = null
const RELAY_KO = { starting: '시작 중', running: '진행 중', blocked: '답 기다리는 중', review: '확인 대기', done: '완료', failed: '실패', stopped: '멈춤' }
const RELAY_ACTIVE = ['running', 'blocked', 'review']
function setRelay(r) {
  const prev = relayState; relayState = r
  const chip = document.getElementById('relayChip'), stop = document.getElementById('relayStop')
  chip.style.display = r ? '' : 'none'
  if (!r) return
  const shown = r.status === 'review' ? r.step - 1 : Math.min(r.step, r.total)
  document.getElementById('relayText').textContent = `릴레이 ${shown}/${r.total} ${RELAY_KO[r.status] || r.status}${r.pauseNext ? ' (다음 전 멈춤)' : ''}`
  chip.title = `${r.name}: ${r.log.join(' / ')}  (눌러서 관리)`
  chip.classList.toggle('help', r.status === 'review' || r.status === 'blocked')
  stop.textContent = RELAY_ACTIVE.includes(r.status) ? '멈춤' : '닫기'
  if (prev && prev.status !== r.status && r.status === 'done') { toast(`릴레이 ‘${r.name}’ 이(가) 끝났어요`); beep(659) }
  if (prev && prev.status !== r.status && r.status === 'blocked') beep(880)
  if (prev && prev.status !== r.status && r.status === 'review') { toast(`릴레이 ‘${r.name}’ ${r.step - 1}단계 결과를 확인해 주세요`); beep(880); openRelayPanel() }
  if (modal.dataset.kind === 'relay' && modal.style.display === 'flex' && prev && (prev.status !== r.status || prev.step !== r.step)) openRelayPanel() // 열어 둔 관리 창은 상태가 바뀔 때만 새로 그린다(입력 중인 글이 날아가지 않게)
}
document.getElementById('relayStop').onclick = (ev) => { ev.stopPropagation(); (RELAY_ACTIVE.includes(relayState?.status)
  ? ask('릴레이를 멈출까요?', '지금 단계의 세션을 멈추고 더 진행하지 않아요.', '멈추기').then((ok) => ok && act('relayStop', {}))
  : act('relayClear', {})) }
document.getElementById('relayChip').onclick = () => openRelayPanel()
// 릴레이 관리 창: 단계별 진행 상황, 남은 단계 지시문 고치기, 단계마다 확인 켜고 끄기, 다음 단계 전에 한 번 멈추기,
// 확인 대기 중이면 다음 단계로 넘길 결과를 고쳐서 넘기기.
function openRelayPanel() {
  const r = relayState

  const stepState = (i) => (i < r.jobs.length - (r.status === 'review' ? 0 : 1) || (r.status === 'done' && i < r.jobs.length) ? '완료' : i === r.jobs.length - 1 && active && r.status !== 'review' ? RELAY_KO[r.status] : '대기')
  const rows = [0, 1, 2, 3].map((i) => {
    const text = r.steps[i] || '', editable = active && i >= from
    if (!editable && !text) return ''
    return `<label>${i + 1}단계, ${stepState(i)}${editable ? ' (고칠 수 있어요' + (i > 0 ? ', 비우면 여기서 끝' : '') + ')' : ''}</label>${editable
      ? `<textarea data-step="${i}" style="height:56px">${esc(text)}</textarea>`
      : `<div class="ask" style="margin-top:0">${esc(text)}</div>`}`
  }).join('')
  modal.dataset.kind = 'relay'
  modalBox.innerHTML = `<h2>릴레이 ${esc(r.name)}: ${RELAY_KO[r.status] || r.status}</h2>
    ${r.status === 'review' ? `<p>${r.step - 1}단계가 끝났어요. 다음 단계로 넘길 결과를 확인하고, 필요하면 고친 뒤 넘겨 주세요.</p>
      <label>다음 단계로 넘길 결과</label><textarea id="rHandoff" style="height:120px">${esc(r.handoff || '')}</textarea>` : ''}
    ${rows}
    ${active ? `<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="rReview"${r.review ? ' checked' : ''}> 단계마다 내가 확인하고 넘기기</label>` : ''}
    <p class="hint">${esc(r.log.join(' / '))}</p>
    <div class="row">
      <button id="rClose">닫기</button>
      ${active && r.status !== 'review' && !r.pauseNext && r.step < r.total ? '<button id="rPause">이 단계 끝나면 멈추기</button>' : ''}
      ${active ? '<button id="rSave">고친 내용 저장</button>' : ''}
      ${r.status === 'review' ? `<button id="rGo" class="primary">${r.step - 1 >= r.total ? '릴레이 마치기' : '이 내용으로 다음 단계 시작'}</button>` : ''}

  if (q('#rSave')) q('#rSave').onclick = () => act('relayEdit', { steps: collect(), review: q('#rReview')?.checked })
  if (q('#rGo')) q('#rGo').onclick = async () => {
    await act('relayEdit', { steps: collect(), review: q('#rReview')?.checked })
    const handoff = q('#rHandoff')?.value
    closeModal(); delete modal.dataset.kind
    await act('relayResume', { handoff })
  }
}

  modal.style.display = 'flex'
  bindDirPicker()
  modalBox.querySelector('#mStep1').focus()
  modalBox.querySelector('#mNo').onclick = closeModal
  modalBox.querySelector('#mYes').onclick = async () => {
    const steps = [1, 2, 3, 4].map((n) => modalBox.querySelector('#mStep' + n).value.trim()).filter(Boolean)

    const cwd = pickedDir(), name = modalBox.querySelector('#mName').value.trim() || '릴레이'

/* ---------- 팀: 방(사무실) 여러 개 ---------- */
// 0번 방은 내 사무실, 그다음은 등록한 동료들의 사무실이다. 탭이나 문으로 오가며, 동료 방은 구경만 한다.
let rooms = [], room = 0, teamState = { share: {}, peers: [] }, lastRoomSwitch = 0, lastTeamKey = ''
function setRooms(team, mySessions, myAgents, myRelay) {
  teamState = team; myUid = team.id || ''
  rooms = [{ id: 'me', name: '내 사무실', ok: true, sessions: mySessions, agents: myAgents, relay: myRelay }, ...(team.peers || []).map((p) => ({ id: p.url, name: p.name || p.url, ok: p.ok, error: p.error, sessions: p.sessions || [], agents: p.agents || [], relay: p.relay || null, avatars: p.avatars || [], chat: p.chat || [] }))]
  if (room >= rooms.length) room = 0
  const cur = rooms[room]
  renderRooms()
  setRelay(room === 0 ? myRelay : cur.relay)
  setAgents(room === 0 ? myAgents : cur.agents)
  sync(cur.ok ? cur.sessions : [])
  syncGuests(room === 0 ? team.visitors : cur.avatars)
  syncChat(room === 0 ? team.chat : cur.chat)
  // 열어 둔 팀 창은 공유 상태나 동료 목록이 실제로 바뀌었을 때만, 그것도 입력 중이 아닐 때만 다시 그린다.
  // 매번 다시 그리면 입력 칸의 커서가 튕기고 복사 버튼이 눌리는 순간 바뀌어 버린다.
  const teamKey = JSON.stringify([team.share, (team.peers || []).map((p) => [p.url, p.name, p.ok, p.error])])
  const changed = teamKey !== lastTeamKey; lastTeamKey = teamKey
  if (changed && modal.dataset.kind === 'team' && modal.style.display === 'flex' && !modalBox.contains(document.activeElement)) openTeamPanel(false)
}
function renderRooms() {
  const el = document.getElementById('rooms')
  const key = JSON.stringify([room, rooms.map((r) => [r.name, r.ok, r.sessions.filter((s) => s.state === 'blocked').length])])
  if (el.dataset.key === key) return
  el.dataset.key = key
  el.innerHTML = rooms.length > 1 ? rooms.map((r, i) => { const help = r.sessions.filter((s) => s.state === 'blocked').length; return `<button class="room${i === room ? ' on' : ''}${r.ok ? '' : ' off'}" data-i="${i}" title="${esc(r.error || '')}">${esc(r.name)}${help ? ` <b>${help}</b>` : ''}${r.ok ? '' : ' 💤'}</button>` }).join('') : ''
  el.querySelectorAll('.room').forEach((b) => { b.onclick = () => switchRoom(Number(b.dataset.i)) })
}
function switchRoom(i) {
  if (i === room || !rooms[i]) return
  lastRoomSwitch = performance.now()
  closePanel()
  for (const e of ents.values()) if (e.id !== ME) { e.tag.remove(); e.bubble.remove(); ents.delete(e.id) } // 방을 바꾸면 그 방 사람들을 처음부터 그린다
  for (const k in slots) slots[k] = []
  planes.length = 0; talkLinks.clear(); lastSeenMsg.clear()
  room = i; firstLoad = true; lastPush = 0
  const cur = rooms[room]
  renderRooms()
  setRelay(room === 0 ? rooms[0].relay : cur.relay)
  setAgents(room === 0 ? rooms[0].agents : cur.agents)
  sync(cur.ok ? cur.sessions : [])
  syncGuests(room === 0 ? teamState.visitors : cur.avatars)
  clearChat(); syncChat(room === 0 ? teamState.chat : cur.chat)
  toast(room === 0 ? '내 사무실로 돌아왔어요' : cur.ok ? `‘${cur.name}’ 의 사무실이에요 (구경만 할 수 있어요)` : `‘${cur.name}’ 의 맥에 연결되지 않아요: ${cur.error || ''}`)
}
// 아바타 위치 주고받기. 내 위치는 내 서버에 알리고(움직일 때 250ms, 가만히 있을 때 3초), 서버가 지금 있는 방의 동료에게 전달한다.
let lastPush = 0, pushing = false
function pushAvatar(me, moving) {
  if (DEMO || pushing || performance.now() - lastPush < (moving ? 250 : 3000)) return
  lastPush = performance.now(); pushing = true
  const l = me.look
  const fresh = me.data.say && Date.now() - (me.data.sayAt || 0) < 15000
  fetch('/api/action/avatar', { method: 'POST', headers: { 'content-type': 'application/json', 'x-town-token': TOKEN }, body: JSON.stringify({ room: rooms[room]?.id || 'me', name: myName(), x: Math.round(me.x), y: Math.round(me.y), dir: me.dir, say: fresh ? me.data.say : '', sayAt: fresh ? me.data.sayAt : 0, sayId: fresh ? me.data.sayId : '', look: { body: l.body, hairStyle: l.hairStyle, outfit: l.outfit, acc: l.acc, accColor: l.accColor, nick: l.nick, hair: l.hair, skin: l.skin, shirt: l.shirt } }) }).catch(() => {}).finally(() => { pushing = false })
}
// 이 방에 있는 다른 사람들의 아바타(방 주인과 방문자). 새 위치로 걸어가고, 소식이 끊기면 사라진다.
function syncGuests(list) {
  const seen = new Set()
  for (const a of list || []) {
    if (!a.name || (a.uid ? a.uid === myUid : a.name === myName())) continue // 나 자신은 고유 번호로 가린다(이름은 모두 "마스터"일 수 있다)
    const id = 'guest:' + (a.uid || a.name)
    seen.add(id)
    let g = ents.get(id)
    if (!g) { g = makeEnt({ id, kind: 'guest', owner: Boolean(a.owner), name: a.name, state: 'idle', detail: '', intent: '', tokens: 0, subagents: [], links: [], talks: [] }); g.zone = 'guest'; g.x = a.x; g.y = a.y }
    Object.assign(g.look, a.look || {}); sheets.delete(g.look)
    g.data.owner = Boolean(a.owner)
    if (Math.hypot(a.x - g.x, a.y - g.y) > 1) g.path = [{ x: a.x, y: a.y }]
    g.dir = a.dir; g.spot = { x: a.x, y: a.y, face: a.dir }
    g.data.say = a.say || ''; g.data.sayAt = a.sayAt || 0
    refreshLabels(g)
  }
  for (const e of ents.values()) if (e.data.kind === 'guest' && !seen.has(e.id)) { e.tag.remove(); e.bubble.remove(); ents.delete(e.id); if (selected === e.id) closePanel() }
}

    <label>동료의 초대 주소</label><input type="text" id="pUrl" placeholder="예: http://192.168.0.12:4778" value="${esc(draftUrl ?? '')}" style="width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:4px;padding:6px">

    <div class="row"><button id="tClose">닫기</button><button id="pAdd" class="primary">동료 붙이기</button></div>`
  modal.style.display = 'flex'
  const q = (sel) => modalBox.querySelector(sel)

  modalBox.querySelectorAll('[data-remove]').forEach((b) => { b.onclick = () => ask('동료를 뺄까요?', `‘${b.dataset.remove}’ 의 사무실을 더 이상 보지 않아요.`, '빼기').then((ok) => ok && act('peerRemove', { url: b.dataset.remove })) })
  if (q('#tOn')) q('#tOn').onclick = () => act('shareOn', { name: q('#tName').value })
  if (q('#tOff')) q('#tOff').onclick = () => act('shareOff', {})
  if (q('#tNewKey')) q('#tNewKey').onclick = () => ask('초대 키를 새로 만들까요?', '지금 키로 등록한 동료들은 새 키로 다시 등록해야 해요.', '새로 만들기').then((ok) => ok && act('shareNewKey', {}))

}

/* ---------- 카메라 (좁은 창) ---------- */
// 좁은 창에서는 사무실을 줄이지 않고 크게 보여주되, 창에 들어오는 너비(view.w)만큼만 비춘다.
// 카메라는 사람이 있는 쪽을 천천히 오가고, 누가 호출 벨을 누르면 그쪽으로 가고, 끌거나 화살표로 직접 움직일 수 있다.
const view = { x: 0, target: 0, w: W, manualUntil: 0, tourAt: 1500 }
const maxPan = () => Math.max(0, W - view.w)
function panTo(x, holdMs) { view.target = Math.max(0, Math.min(maxPan(), x)); if (holdMs) view.manualUntil = performance.now() + holdMs }
function focusOn(e, holdMs) { if (maxPan() > 0) panTo(e.x + 6 - view.w / 2, holdMs) }
function stepCamera(t, dt) {
  const max = maxPan()
  if (!max) { view.x = view.target = 0; return }
  if (t > view.manualUntil && t > view.tourAt) { // 자동 순회: 한쪽에서만 보이는 캐릭터가 있는 쪽들을 번갈아 비춘다
    let left = 0, right = 0, bell = 0
    for (const e of ents.values()) { if (e.x + 12 < max) left++; if (e.x > view.w) right++; if (e.zone === 'help') bell++ }
    const atRight = view.target > max / 2
    if (bell && !atRight) panTo(max)
    else if (atRight ? left > 0 : right > 0) panTo(atRight ? 0 : max)
    view.tourAt = t + (bell && view.target > max / 2 ? 16000 : 9000) // 누가 기다리고 있으면 그쪽을 더 오래 비춘다
  }
  view.x += (view.target - view.x) * Math.min(1, dt * 3.5)
  if (Math.abs(view.target - view.x) < 0.3) view.x = view.target
}
let drag = null
cv.addEventListener('mousedown', (ev) => { if (maxPan() > 0) drag = { x0: ev.clientX, cam0: view.x, moved: false } })
addEventListener('mousemove', (ev) => { if (!drag) return; const dx = ev.clientX - drag.x0; if (Math.abs(dx) > 4) drag.moved = true; if (drag.moved) { panTo(drag.cam0 - dx / scale, 30000); view.x = view.target } })
addEventListener('mouseup', () => { if (drag && drag.moved) justDragged = performance.now(); drag = null })
let justDragged = 0
cv.addEventListener('wheel', (ev) => { if (maxPan() > 0 && Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) { ev.preventDefault(); panTo(view.target + ev.deltaX / scale, 30000) } }, { passive: false })
document.getElementById('panL').onclick = () => panTo(0, 30000)
document.getElementById('panR').onclick = () => panTo(maxPan(), 30000)

let compact = false
function fit() {
  // 창이 좁으면(760px 미만) 압축 구성으로 바꾼다. 머리줄이 여러 줄로 접히므로 높이는 그때그때 잰다.
  const was = compact
  compact = innerWidth < 760
  document.body.classList.toggle('compact', compact)
  const headerH = document.querySelector('header').offsetHeight
  if (compact) { // 세로 공간의 62% 까지 쓰면서 0.5 단위로 가장 큰 배율을 고르고, 너비는 들어오는 만큼만 비춘다(최소 250px 분량)
    const availW = innerWidth - 20
    scale = Math.max(1, Math.min(3, Math.floor((((innerHeight - headerH) * 0.62) / H) * 2) / 2))
    while (scale > 1 && availW / scale < 250) scale -= 0.5
    view.w = Math.min(W, Math.floor(availW / scale))
  }
  else { const aw = innerWidth - 40, ah = innerHeight - headerH - 36; scale = Math.max(1, Math.floor(Math.min(aw / W, ah / H) * 2) / 2); view.w = W }
  if (was !== compact) renderList(true)
  document.documentElement.style.setProperty('--s', scale)
  document.body.classList.toggle('tiny', compact && scale < 1.5)
  if (cv.width !== view.w) { cv.width = view.w; ctx.imageSmoothingEnabled = false } // 캔버스 너비를 바꾸면 그리기 설정이 초기화된다
  cv.style.width = view.w * scale + 'px'; cv.style.height = H * scale + 'px'
  panTo(view.target); view.x = Math.min(view.x, maxPan())
  document.getElementById('panL').classList.toggle('on', maxPan() > 0); document.getElementById('panR').classList.toggle('on', maxPan() > 0)
}
const zoneEls = []
for (const [text, x, y] of [['작업실', 4, 55], [`${OWNER} 호출 벨`, 388, 40], ['휴게실', 4, 217]]) {

// 주소에 ?demo=1 을 붙이면 가짜 세션으로 자리와 가구 배치를 한눈에 확인할 수 있다.
const DEMO = new URLSearchParams(location.search).get('demo') // '1' 은 가득 찬 정지 장면, 'story' 는 22초짜리 시연
const CAPTURE = new URLSearchParams(location.search).has('capture') // 밖에서 __tick 으로 시간을 밀며 한 장씩 찍는 용도
const STORY_LEN = 22
// 시연 장면: 출근, 조수 합류, 호출 벨로 이동, 일을 끝내고 휴게실로. sec 은 장면이 시작된 뒤 흐른 초.
function demoStory(sec) {
  const now = Date.now(), H1 = 3.6e6
  const mk = (id, name, state, detail, extra = {}) => ({ id, kind: 'bg', name, state, detail, intent: '', tokens: 40000, project: 'demo', worktree: null, createdAt: now - H1, updatedAt: now, helpers: 0, links: [], subagents: [], permissionMode: 'auto', lastText: null, pending: null, tool: 'Bash', phase: 'tool', ...extra })
  const rest = (i, hoursAgo, tokens) => mk('rest' + i, ['주간 리포트 정리', '이미지 최적화', '의존성 업데이트', '테스트 보강', 'API 문서 갱신', '접근성 점검'][i], 'done', '끝났어요', { updatedAt: now - hoursAgo * H1, tokens, phase: null, tool: null })
  const subs = sec >= 3 && sec < 14 ? [{ id: 'fe', type: 'frontend-developer', description: '결제 버튼 컴포넌트 분리', at: now }, { id: 'ex', type: 'Explore', description: '결제 관련 파일 찾기', at: now }] : []
  const list = [
    sec < 14 ? mk('pay', '결제 페이지 리팩터링', 'working', '컴포넌트를 나누는 중', { subagents: subs, tokens: 900000, phase: Math.floor(sec) % 4 < 2 ? 'tool' : 'thinking', tool: 'Edit' }) : mk('pay', '결제 페이지 리팩터링', 'done', 'PR을 올렸어요', { tokens: 960000, phase: null }),
    sec < 8 ? mk('login', '로그인 버그 수정', 'working', '테스트 돌리는 중', { tokens: 120000 }) : mk('login', '로그인 버그 수정', 'blocked', '운영에 바로 배포할까요?', { tokens: 130000, lastText: '수정은 끝났습니다. 운영에 바로 배포할까요, 내일 오전에 할까요?' }),
    rest(0, 2, 300000), rest(1, 30, 80000), rest(2, 5, 1500000), rest(3, 50, 20000), rest(4, 1, 600000), rest(5, 80, 9000),
  ]
  if (sec >= 1) list.push(mk('readme', 'README 번역', 'working', '영어로 옮기는 중', { tokens: 15000, phase: 'thinking' }))
  return list
}
function demoSessions() {
  const mk = (i, state, extra = {}) => ({ id: 'demo' + i, kind: 'bg', name: `demo session ${i}`, state, detail: state === 'working' ? 'building the pixel office' : state === 'blocked' ? 'waiting for a decision' : '', intent: '', tokens: 3000 * (i + 1) ** 2, project: 'demo', worktree: null, createdAt: Date.now() - 3.6e6, updatedAt: Date.now() - (i % 3 ? 2 : 40) * 3.6e6, helpers: 0, links: [], subagents: [], permissionMode: i % 2 ? 'auto' : 'default', lastText: state === 'blocked' ? '배포 전에 확인이 필요합니다.\n1) 지금 바로 배포\n2) 내일 오전에 배포\n어느 쪽으로 할까요?' : null, pending: null, tool: 'Bash', phase: i % 2 ? 'tool' : 'thinking', ...extra })
  const sub = (id, type) => ({ id, type, description: 'demo task', at: Date.now() })
  return [mk(0, 'working', { subagents: [sub('a', 'Explore'), sub('b', 'frontend-developer'), sub('c', 'Plan')] }), mk(1, 'working'), mk(2, 'working', { subagents: [sub('d', 'general-purpose')] }), mk(3, 'working'), mk(4, 'working'),
    mk(5, 'blocked', { talks: [{ dir: 'in', peer: 'demo session 1', at: Date.now(), handback: false, text: '배포 판단은 네가 해 줘. 테스트는 다 통과했어.' }] }), // 세션끼리 대화하는 모습 확인용
    mk(6, 'blocked'), ...[...Array(17).keys()].map((k) => mk(7 + k, 'done'))]
}
function setAgents(list) { agentsData = list; agentIndex = new Map(list.map((a) => [a.type, a])); if (rosterOpen) renderRoster(false) }
function demoAgents() {
  const mk = (type, scope, count, days, active) => ({ type, scope, description: scope === 'builtin' ? '' : `${type} 역할의 데모 에이전트입니다.`, count, lastAt: Date.now() - days * 864e5, active: active ? [{ sessionName: active }] : [], byProject: { demo: count }, recent: [...Array(Math.min(count, 4)).keys()].map((k) => ({ description: `demo task ${k + 1}`, at: Date.now() - (days + k) * 864e5, project: 'demo', sessionName: 'demo session 0' })) })
  return [mk('frontend-developer', 'user', 8, 0, 'demo session 0'), mk('Explore', 'builtin', 7, 0, 'demo session 0'), mk('general-purpose', 'builtin', 24, 0, 'demo session 2'), mk('data-scientist', 'user', 15, 4), mk('senior-pd', 'user', 5, 5), mk('backend-developer', 'user', 6, 6), mk('senior-pm', 'user', 0, 0)].map((a) => (a.count ? a : { ...a, lastAt: null, recent: [] }))
}
let storyStart = performance.now(), lastStorySec = 0
async function poll() {
  if (DEMO === 'story') { // 실제 시간으로 장면을 반복 재생한다
    const sec = ((performance.now() - storyStart) / 1000) % (STORY_LEN + 2)
    if (sec < lastStorySec) { for (const e of ents.values()) { e.tag.remove(); e.bubble.remove() } ents.clear(); for (const k in slots) slots[k] = []; firstLoad = true }
    lastStorySec = sec; setAgents(demoAgents()); return sync(demoStory(sec))
  }
  if (DEMO) { setRooms({ share: { enabled: true, name: '나', port: 4778, key: 'demo', addresses: ['192.168.0.10'], listening: true }, peers: [{ url: 'http://192.168.0.11:4778', name: '철수', ok: true, sessions: demoSessions().slice(2, 9).map((s) => ({ ...s, id: 'p' + s.id, name: s.name.replace('demo', '철수') })), agents: [], relay: null }, { url: 'http://192.168.0.12:4778', name: '영희', ok: false, error: '응답이 없어요 (맥이 잠들었거나 꺼져 있을 수 있어요)' }] }, demoSessions(), demoAgents(), null); return }
  try {
    const res = await fetch('/api/sessions', { cache: 'no-store' })
    const data = await res.json()
    knownDirs = data.dirs || []; recentDirs = data.recentDirs || []; HOME = data.home || ''
    setRooms(data.team || { share: {}, peers: [] }, data.sessions, data.agents || [], data.relay || null)
    document.getElementById('offline').style.display = 'none'
  } catch { document.getElementById('offline').style.display = 'block' }
}
function tickClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) }
addEventListener('resize', fit)
paintSound(); fit(); paintBackground(); tickClock()
setInterval(paintBackground, 30000); setInterval(tickClock, 1000)
{ const side = new URLSearchParams(location.search).get('pan'); if (side) { panTo(side === 'right' ? W : 0, 600000); view.x = view.target } } // 확인용: ?pan=right
if (CAPTURE) { // 시간을 밖에서 밀어 가며 한 장씩 그린다(GIF 제작용). 0.5초마다 장면 데이터를 다시 읽는다.
